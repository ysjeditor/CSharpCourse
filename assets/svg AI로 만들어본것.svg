<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- 배경 사각형 1개 -->
  <rect x="0" y="0" width="900" height="540" fill="#f6f8fc" />

  <!-- 박스 1 (B1 - amber) -->
  <rect x="160" y="42" width="320" height="54" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 164 42 H 166 V 96 H 164 A 4 4 0 0 1 160 92 V 46 A 4 4 0 0 1 164 42 Z" fill="#f59e0b" />
  <text x="184" y="75" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="16" font-weight="600" fill="#1e293b">while (running) 검사</text>

  <!-- 박스 2 (B2 - blue) -->
  <rect x="160" y="138" width="320" height="54" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 164 138 H 166 V 192 H 164 A 4 4 0 0 1 160 188 V 142 A 4 4 0 0 1 164 138 Z" fill="#3b82f6" />
  <text x="184" y="171" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="16" font-weight="600" fill="#1e293b">① Render — 화면 출력</text>

  <!-- 박스 3 (B3 - red) -->
  <rect x="160" y="234" width="320" height="54" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 164 234 H 166 V 288 H 164 A 4 4 0 0 1 160 284 V 238 A 4 4 0 0 1 164 234 Z" fill="#ef4444" />
  <text x="184" y="267" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="16" font-weight="600" fill="#1e293b">② 종료 조건 검사</text>

  <!-- 박스 4 (Exit - red, B3과 동일) -->
  <rect x="570" y="234" width="280" height="54" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 574 234 H 576 V 288 H 574 A 4 4 0 0 1 570 284 V 238 A 4 4 0 0 1 574 234 Z" fill="#ef4444" />
  <text x="594" y="267" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="16" font-weight="600" fill="#1e293b">승리/파산 메시지 출력 후 break</text>

  <!-- 박스 5 (B4 - purple) -->
  <rect x="160" y="330" width="320" height="54" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 164 330 H 166 V 384 H 164 A 4 4 0 0 1 160 380 V 334 A 4 4 0 0 1 164 330 Z" fill="#8b5cf6" />
  <text x="184" y="363" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="16" font-weight="600" fill="#1e293b">③ Input — 메뉴 입력</text>

  <!-- 박스 6 (B5 - green) -->
  <rect x="160" y="426" width="320" height="54" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <path d="M 164 426 H 166 V 480 H 164 A 4 4 0 0 1 160 476 V 430 A 4 4 0 0 1 164 426 Z" fill="#10b981" />
  <text x="184" y="459" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="16" font-weight="600" fill="#1e293b">④ Update — 조건문 분기</text>

  <!-- 화살표 1: B1 -> B2 -->
  <path d="M 320 96 L 320 134" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 화살표 2: B2 -> B3 -->
  <path d="M 320 192 L 320 230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 화살표 3: B3 -> B4 (계속) -->
  <path d="M 320 288 L 320 326" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="330" y="313" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="13" font-weight="600" fill="#475569">계속</text>

  <!-- 화살표 4: B3 -> Exit (승리/파산) -->
  <path d="M 480 261 L 566 261" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)" />
  <text x="523" y="251" text-anchor="middle" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="13" font-weight="600" fill="#ef4444">승리/파산</text>

  <!-- 화살표 5: B4 -> B5 -->
  <path d="M 320 384 L 320 422" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 화살표 6: B5 -> B1 (다음 반복) -->
  <path d="M 160 453 L 96 453 Q 84 453 84 441 L 84 81 Q 84 69 96 69 L 156 69" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="72" y="265" text-anchor="end" font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif" font-size="13" font-weight="600" fill="#475569">다음 반복</text>
</svg>
