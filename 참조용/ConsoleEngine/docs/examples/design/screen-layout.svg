<svg xmlns="http://www.w3.org/2000/svg"
     width="640" height="368" viewBox="0 0 640 368">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- 게임 화면: 30×20칸, 한 칸 16px (기획서 v1.1: 화면 문구 ASCII) -->
  <rect x="16" y="16" width="480" height="320" fill="none" stroke="#333333"/>
  <line x1="16" y1="32" x2="496" y2="32" stroke="#999999"/>
  <g font-family="monospace" font-size="14">
    <text x="20" y="29">TIME 12/60</text>
    <text x="256" y="173" text-anchor="middle">GAME OVER - R: retry</text>
  </g>
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <text x="88" y="78">*</text>
    <text x="376" y="62">*</text>
    <text x="200" y="126">*</text>
    <text x="328" y="222">*</text>
    <text x="440" y="270">*</text>
    <text x="264" y="332">@</text>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#555555">
    <text x="508" y="29">← 상태 줄</text>
    <text x="508" y="173">← 끝 메시지</text>
    <text x="508" y="332">← 플레이어 @</text>
    <text x="256" y="356" text-anchor="middle">가로 30칸 × 세로 20칸 · 한 칸 16px</text>
  </g>
</svg>
