h:1250px){.guide-layout{grid-template-columns:1fr}.tasknav{display:flex;flex-wrap:wrap;gap:8px}.tasknav button{width:auto;margin:0}.document-pair{grid-template-columns:1fr}iframe{height:650px}}@media(max-width:650px){.guide-shell{padding:16px}.task-card{padding:18px}.guide-head h1{font-size:25px}.diagram svg{min-width:680px}}

<main><div class="toolbar"><span>입문 학습 교재 / Visual Studio · C#</span><div><button id="theme" aria-pressed="false">어두운 화면</button></div></div><div class="hero"><div id="counter" class="label"></div><h1 id="title"></h1><div class="sub">개념 읽기 → 코드 실행 → 결과 확인 → 직접 해보기</div></div><div class="notice">플레이어 관점의 규칙 · 통합 게임 기준으로 읽습니다. <a href="index.html" target="_top">두 문서와 실습 과제 보기</a> · <a href="시스템문서.html">시스템문서 열기</a></div><article id="content" tabindex="-1"></article><div class="bottom"><button id="prev">← 이전 단원</button><button id="complete" class="done">학습 완료 표시</button><button id="next">다음 단원 →</button></div><div id="status" role="status" aria-live="polite"></div><footer>학습 기록은 현재 브라우저에 저장됩니다. 파일을 이동하거나 브라우저 설정을 변경하면 기록이 유지되지 않을 수 있습니다.</footer></main>
<script>
const chapters=[{"title": "01. 어떤 게임을 만드는가", "body": "\u003ch2>한 줄 기획\u003c/h2>\u003cp>신규 모험가가 이름을 등록하고 사냥으로 성장하여 전직하고 길드에 가입하는 \u003cstrong>콘솔 기반 텍스트 RPG\u003c/strong>입니다. 화면 장식보다 입력 → 판단 → 상태 변경 → 결과 안내의 연결을 구현하는 것이 학습 목표입니다.\u003c/p>\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 416\" role=\"img\" aria-label=\"플레이의 중심은 메뉴로 돌아오는 반복\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">플레이의 중심은 메뉴로 돌아오는 반복\u003c/text>\u003cpath d=\"M348.0 134.0L378.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 134.0L732.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M894.0 204V228.0H894.0V252\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M348.0 322.0L378.0 322.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 322.0L732.0 322.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">01 이름 등록\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">모험가 증명서 발급\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">Lv.1 · HP 100 · ATK 15\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">02 메인 메뉴\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">사냥 / 전직 / 가입\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">도감 / 길드 / 내 정보\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">03 사냥과 성장\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">선공 → 반격 → 승패\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">승리하면 처치·성장\u003c/text>\u003crect x=\"24.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"42.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">04 전직\u003c/text>\u003ctext x=\"42.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">조건 검사 후 직업 변경\u003c/text>\u003ctext x=\"42.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">HP +20 · ATK +5\u003c/text>\u003crect x=\"378.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"396.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">05 길드 참여\u003c/text>\u003ctext x=\"396.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">조건 충족 후 가입\u003c/text>\u003ctext x=\"396.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">명단 · 검색 · 추방\u003c/text>\u003crect x=\"732.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"750.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">06 메뉴 복귀 / 종료\u003c/text>\u003ctext x=\"750.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">각 기능 후 메뉴로\u003c/text>\u003ctext x=\"750.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">0 또는 메인 입력 종료\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>플레이어가 할 수 있는 일\u003c/h2>\u003cp>이름 등록, 사냥, 전직, 길드 가입 신청, 몬스터 도감 확인, 길드원 검색·추방, 내 정보 확인, 종료를 제공합니다. 메뉴 번호가 잘못되면 안내 후 메뉴로 돌아갑니다. 기본 게임에는 저장·불러오기, 방어력, 골드, 아이템, 장비, 스킬 메뉴가 없습니다.\u003c/p>\u003cp>\u003cstrong>완성 기준:\u003c/strong> 메뉴 하나만 동작하는 것이 아니라 사냥으로 변경된 상태가 전직·가입·내 정보·도감에 연결되어야 합니다.\u003c/p>", "search": "01. 어떤 게임을 만드는가\n\n### 한 줄 기획\n\n신규 모험가가 이름을 등록하고 사냥으로 성장하여 전직하고 길드에 가입하는 **콘솔 기반 텍스트 RPG**입니다. 화면 장식보다 입력 → 판단 → 상태 변경 → 결과 안내의 연결을 구현하는 것이 학습 목표입니다.\n\n\u003c!-- SVG:journey -->\n\n### 플레이어가 할 수 있는 일\n\n이름 등록, 사냥, 전직, 길드 가입 신청, 몬스터 도감 확인, 길드원 검색·추방, 내 정보 확인, 종료를 제공합니다. 메뉴 번호가 잘못되면 안내 후 메뉴로 돌아갑니다. 기본 게임에는 저장·불러오기, 방어력, 골드, 아이템, 장비, 스킬 메뉴가 없습니다.\n\n**완성 기준:** 메뉴 하나만 동작하는 것이 아니라 사냥으로 변경된 상태가 전직·가입·내 정보·도감에 연결되어야 합니다.\n\n"}, {"title": "02. 플레이 화면과 입력 흐름", "body": "\u003ch2>시작 화면에서 메뉴로\u003c/h2>\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 242\" role=\"img\" aria-label=\"콘솔 화면 와이어프레임\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">콘솔 화면 와이어프레임\u003c/text>\u003cpath d=\"M348.0 141.0L378.0 141.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 141.0L732.0 141.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"154\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"130\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">시작 화면\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">QUEST LOG\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">이름은? &gt; 아린\u003c/text>\u003ctext x=\"42.0\" y=\"171\" font-size=\"15\" fill=\"#354b61\">환영합니다, 아린\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"154\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"130\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">메인 메뉴\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">1 사냥  2 전직  3 가입\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">4 도감  5 길드  6 내정보\u003c/text>\u003ctext x=\"396.0\" y=\"171\" font-size=\"15\" fill=\"#354b61\">0 종료  | 선택 &gt; 6\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"154\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"130\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">내 정보 / 결과\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">[아린] 모험가 Lv.1\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">HP 100/100 · ATK 15\u003c/text>\u003ctext x=\"750.0\" y=\"171\" font-size=\"15\" fill=\"#354b61\">처치 0 → 메뉴로 복귀\u003c/text>\u003c/svg>\u003c/figure>\u003cp>이름은 앞뒤 공백을 제거합니다. 비어 있거나 공백뿐이면 \u003cstrong>이름없는떠돌이\u003c/strong>로 시작합니다. 새 캐릭터는 모험가, 레벨 1, HP 100/100, 공격력 15, 처치 수 0입니다. 시작할 때 기존 길드원 세라와 도윤이 등록됩니다. 플레이어는 아직 가입하지 않은 상태입니다.\u003c/p>\u003ch2>메뉴 규칙\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">입력\u003c/th>\u003cth scope=\"col\">기능\u003c/th>\u003cth scope=\"col\">처리 후 이동\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>몬스터 선택과 사냥\u003c/td>\u003ctd>승패 처리 후 메인 메뉴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>기사·도적·마법사 전직 신청\u003c/td>\u003ctd>성공·실패 안내 후 메뉴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>길드 가입 신청\u003c/td>\u003ctd>중복·조건 확인 후 메뉴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>몬스터 도감\u003c/td>\u003ctd>표시 후 메뉴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>길드 명단, a: 검색, b: 추방\u003c/td>\u003ctd>한 작업 후 메인 메뉴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>내 정보\u003c/td>\u003ctd>표시 후 메뉴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0\u003c/td>\u003ctd>종료\u003c/td>\u003ctd>종료 메시지 후 끝\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>입력 앞뒤 공백은 정리합니다. 관리 메뉴에서 a/b 외 입력은 뒤로 가기입니다. 메인 메뉴의 입력 종료(EOF)는 안전 종료로 처리합니다. 최종 게임 시작 화면의 환영 문장은 가입 완료와 같지 않습니다.\u003c/p>", "search": "02. 플레이 화면과 입력 흐름\n\n### 시작 화면에서 메뉴로\n\n\u003c!-- SVG:screens -->\n\n이름은 앞뒤 공백을 제거합니다. 비어 있거나 공백뿐이면 **이름없는떠돌이**로 시작합니다. 새 캐릭터는 모험가, 레벨 1, HP 100/100, 공격력 15, 처치 수 0입니다. 시작할 때 기존 길드원 세라와 도윤이 등록됩니다. 플레이어는 아직 가입하지 않은 상태입니다.\n\n### 메뉴 규칙\n\n| 입력 | 기능 | 처리 후 이동 |\n| --- | --- | --- |\n| 1 | 몬스터 선택과 사냥 | 승패 처리 후 메인 메뉴 |\n| 2 | 기사·도적·마법사 전직 신청 | 성공·실패 안내 후 메뉴 |\n| 3 | 길드 가입 신청 | 중복·조건 확인 후 메뉴 |\n| 4 | 몬스터 도감 | 표시 후 메뉴 |\n| 5 | 길드 명단, a: 검색, b: 추방 | 한 작업 후 메인 메뉴 |\n| 6 | 내 정보 | 표시 후 메뉴 |\n| 0 | 종료 | 종료 메시지 후 끝 |\n\n입력 앞뒤 공백은 정리합니다. 관리 메뉴에서 a/b 외 입력은 뒤로 가기입니다. 메인 메뉴의 입력 종료(EOF)는 안전 종료로 처리합니다. 최종 게임 시작 화면의 환영 문장은 가입 완료와 같지 않습니다.\n\n"}, {"title": "03. 전투 한 턴의 규칙", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 416\" role=\"img\" aria-label=\"전투 규칙 · 한쪽이 쓰러질 때까지 반복\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">전투 규칙 · 한쪽이 쓰러질 때까지 반복\u003c/text>\u003cpath d=\"M348.0 134.0L378.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 134.0L732.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M894.0 204V228.0H540.0V252\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 322.0L732.0 322.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">01 전투 시작\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">모험가와 새 몬스터\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">둘 다 생존하면 턴 시작\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">02 모험가 공격\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">일반 ATK / 치명 1.5배\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">HP 하한은 0\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">03 몬스터 생존?\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">사망: 즉시 승리\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">생존: 반격 단계\u003c/text>\u003crect x=\"24.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"42.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">승리 처리\u003c/text>\u003ctext x=\"42.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">처치 종 기록 · 처치 +1\u003c/text>\u003ctext x=\"42.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">조건에 따라 레벨 상승\u003c/text>\u003crect x=\"378.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#ffece7\" stroke=\"#a44232\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#a44232\"/>\u003ctext x=\"396.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#a44232\">04 몬스터 반격\u003c/text>\u003ctext x=\"396.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">몬스터 ATK로 공격\u003c/text>\u003ctext x=\"396.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">모험가 생존 시 다음 턴\u003c/text>\u003crect x=\"732.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"750.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">패배 처리\u003c/text>\u003ctext x=\"750.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">성장 보상 없음\u003c/text>\u003ctext x=\"750.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">HP 전체 회복 → 메뉴\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>공격과 승패\u003c/h2>\u003cp>모험가가 먼저 공격합니다. 몬스터가 쓰러지면 반격하지 않습니다. 살아 있다면 정해진 공격력으로 반격합니다. 둘 중 한쪽의 HP가 0이 될 때까지 반복하며 HP는 0 아래로 내려가지 않습니다.\u003c/p>\u003cp>모험가 공격은 \u003cstrong>30% 확률로 치명타\u003c/strong>입니다. 일반 피해는 공격력 그대로, 치명타 피해는 공격력 × 1.5의 소수 부분을 버린 정수입니다. 공격력이 15이면 일반 15, 치명타 22입니다. 몬스터는 치명타를 사용하지 않습니다.\u003c/p>\u003ch2>전투 종료 후\u003c/h2>\u003cul>\u003cli>승리: 해당 종을 도감에 처치로 표시하고, 처치 수와 성장 처리를 적용합니다.\u003c/li>\u003cli>패배: 처치·성장 보상을 지급하지 않고 모험가 HP를 최대치로 회복한 뒤 메뉴로 돌아갑니다.\u003c/li>\u003cli>전투 중 도주·회복·대상 변경 선택은 기본 기능에 없습니다.\u003c/li>\u003c/ul>\u003cp>난수 때문에 실제 턴 수는 달라집니다. 검증할 때는 일반/치명타를 분리해 확인하거나 최소·최대 피해 범위를 기준으로 판단합니다. 기획에서 특정 턴 수를 항상 보장하지 않습니다.\u003c/p>", "search": "03. 전투 한 턴의 규칙\n\n\u003c!-- SVG:battle -->\n\n### 공격과 승패\n\n모험가가 먼저 공격합니다. 몬스터가 쓰러지면 반격하지 않습니다. 살아 있다면 정해진 공격력으로 반격합니다. 둘 중 한쪽의 HP가 0이 될 때까지 반복하며 HP는 0 아래로 내려가지 않습니다.\n\n모험가 공격은 **30% 확률로 치명타**입니다. 일반 피해는 공격력 그대로, 치명타 피해는 공격력 × 1.5의 소수 부분을 버린 정수입니다. 공격력이 15이면 일반 15, 치명타 22입니다. 몬스터는 치명타를 사용하지 않습니다.\n\n### 전투 종료 후\n\n- 승리: 해당 종을 도감에 처치로 표시하고, 처치 수와 성장 처리를 적용합니다.\n- 패배: 처치·성장 보상을 지급하지 않고 모험가 HP를 최대치로 회복한 뒤 메뉴로 돌아갑니다.\n- 전투 중 도주·회복·대상 변경 선택은 기본 기능에 없습니다.\n\n난수 때문에 실제 턴 수는 달라집니다. 검증할 때는 일반/치명타를 분리해 확인하거나 최소·최대 피해 범위를 기준으로 판단합니다. 기획에서 특정 턴 수를 항상 보장하지 않습니다.\n\n"}, {"title": "04. 성장과 전직 조건", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 416\" role=\"img\" aria-label=\"성장 예시 · 슬라임만 사냥했을 때\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">성장 예시 · 슬라임만 사냥했을 때\u003c/text>\u003cpath d=\"M348.0 134.0L378.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 134.0L732.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M540.0 204V228.0H186.0V252\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M894.0 204V228.0H540.0V252\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">시작\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Lv.1 / 처치 0\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">HP 100 · ATK 15\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">2마리 처치\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Lv.2 / 처치 2\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">HP 110 · ATK 18\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">4마리 처치\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Lv.3 / 처치 4\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">HP 120 · ATK 21\u003c/text>\u003crect x=\"24.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">가입 가능\u003c/text>\u003ctext x=\"42.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">Lv.2 이상 AND 처치 1 이상\u003c/text>\u003ctext x=\"42.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">두 조건 모두 검사\u003c/text>\u003crect x=\"378.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"396.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">기사 전직 성공\u003c/text>\u003ctext x=\"396.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">모험가 · Lv.3 · 처치 4\u003c/text>\u003ctext x=\"396.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">최대 HP 140 · ATK 26\u003c/text>\u003crect x=\"732.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"750.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">일반 성장 규칙\u003c/text>\u003ctext x=\"750.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">이번 보상 ≥ 30 OR 짝수 처치\u003c/text>\u003ctext x=\"750.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">충족 시 레벨은 한 번만 +1\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>성장은 누적 경험치 막대가 아닙니다\u003c/h2>\u003cp>승리할 때 처치 수가 1 증가합니다. 그 몬스터 보상이 30 이상이거나, 증가한 처치 수가 짝수이면 레벨이 \u003cstrong>한 번\u003c/strong> 오릅니다. 두 조건을 동시에 만족해도 두 번 오르지 않습니다. 보상을 합산하는 경험치 저장소는 없습니다.\u003c/p>\u003cp>레벨 상승마다 최대 HP +10, 공격력 +3, HP 완전 회복입니다. 슬라임만 잡으면 처치 2회에서 레벨 2, 처치 4회에서 레벨 3이 됩니다. 고블린 이상은 보상이 30 이상이라 처치마다 레벨이 오릅니다.\u003c/p>\u003ch2>전직 조건과 보너스\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">지망 직업\u003c/th>\u003cth scope=\"col\">공통 조건\u003c/th>\u003cth scope=\"col\">추가 조건\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>기사\u003c/td>\u003ctd>현재 모험가이며 레벨 3 이상\u003c/td>\u003ctd>처치 수 4 이상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>도적\u003c/td>\u003ctd>현재 모험가이며 레벨 3 이상\u003c/td>\u003ctd>처치 수 3 이상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>마법사\u003c/td>\u003ctd>현재 모험가이며 레벨 3 이상\u003c/td>\u003ctd>레벨 4 이상\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>성공하면 직업 변경, 최대 HP +20, 공격력 +5, HP 완전 회복을 적용합니다. 전직한 캐릭터는 재전직할 수 없습니다. 실패하면 상태를 변경하지 않고 부족한 조건을 안내합니다. 직업별 추가 전투 스킬은 없습니다.\u003c/p>", "search": "04. 성장과 전직 조건\n\n\u003c!-- SVG:growth -->\n\n### 성장은 누적 경험치 막대가 아닙니다\n\n승리할 때 처치 수가 1 증가합니다. 그 몬스터 보상이 30 이상이거나, 증가한 처치 수가 짝수이면 레벨이 **한 번** 오릅니다. 두 조건을 동시에 만족해도 두 번 오르지 않습니다. 보상을 합산하는 경험치 저장소는 없습니다.\n\n레벨 상승마다 최대 HP +10, 공격력 +3, HP 완전 회복입니다. 슬라임만 잡으면 처치 2회에서 레벨 2, 처치 4회에서 레벨 3이 됩니다. 고블린 이상은 보상이 30 이상이라 처치마다 레벨이 오릅니다.\n\n### 전직 조건과 보너스\n\n| 지망 직업 | 공통 조건 | 추가 조건 |\n| --- | --- | --- |\n| 기사 | 현재 모험가이며 레벨 3 이상 | 처치 수 4 이상 |\n| 도적 | 현재 모험가이며 레벨 3 이상 | 처치 수 3 이상 |\n| 마법사 | 현재 모험가이며 레벨 3 이상 | 레벨 4 이상 |\n\n성공하면 직업 변경, 최대 HP +20, 공격력 +5, HP 완전 회복을 적용합니다. 전직한 캐릭터는 재전직할 수 없습니다. 실패하면 상태를 변경하지 않고 부족한 조건을 안내합니다. 직업별 추가 전투 스킬은 없습니다.\n\n"}, {"title": "05. 몬스터 도감과 전투 대상", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 558\" role=\"img\" aria-label=\"몬스터 카드 · 바 길이는 최대 HP의 상대 크기\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">몬스터 카드 · 바 길이는 최대 HP의 상대 크기\u003c/text>\u003crect x=\"24\" y=\"64\" width=\"501\" height=\"215\" rx=\"14\" fill=\"white\" stroke=\"#dce4ee\"/>\u003cpath d=\"M57 176Q54 139 102 126Q150 139 147 176Z\" fill=\"#65baa2\"/>\u003ccircle cx=\"88\" cy=\"154\" r=\"4\" fill=\"#24384a\"/>\u003ccircle cx=\"116\" cy=\"154\" r=\"4\" fill=\"#24384a\"/>\u003ctext x=\"174\" y=\"103\" font-size=\"23\" font-weight=\"700\" fill=\"#253d54\">1. 슬라임\u003c/text>\u003ctext x=\"174\" y=\"129\" font-size=\"15\" fill=\"#64768b\">초원 · 새 전투는 최대 HP\u003c/text>\u003ctext x=\"174\" y=\"170\" font-size=\"13\" fill=\"#64768b\">HP\u003c/text>\u003ctext x=\"174\" y=\"198\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">30\u003c/text>\u003ctext x=\"282\" y=\"170\" font-size=\"13\" fill=\"#64768b\">ATK\u003c/text>\u003ctext x=\"282\" y=\"198\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">6\u003c/text>\u003ctext x=\"390\" y=\"170\" font-size=\"13\" fill=\"#64768b\">보상\u003c/text>\u003ctext x=\"390\" y=\"198\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">20\u003c/text>\u003crect x=\"48\" y=\"237\" width=\"453\" height=\"10\" rx=\"5\" fill=\"#edf1f6\"/>\u003crect x=\"48\" y=\"237\" width=\"45.3\" height=\"10\" rx=\"5\" fill=\"#65baa2\"/>\u003crect x=\"555\" y=\"64\" width=\"501\" height=\"215\" rx=\"14\" fill=\"white\" stroke=\"#dce4ee\"/>\u003cpath d=\"M603 139L580 129L598 157L613 183H653L668 157L686 129L663 139Z\" fill=\"#92b76a\"/>\u003ccircle cx=\"621\" cy=\"154\" r=\"4\" fill=\"#24384a\"/>\u003ccircle cx=\"645\" cy=\"154\" r=\"4\" fill=\"#24384a\"/>\u003ctext x=\"705\" y=\"103\" font-size=\"23\" font-weight=\"700\" fill=\"#253d54\">2. 고블린\u003c/text>\u003ctext x=\"705\" y=\"129\" font-size=\"15\" fill=\"#64768b\">동굴 · 새 전투는 최대 HP\u003c/text>\u003ctext x=\"705\" y=\"170\" font-size=\"13\" fill=\"#64768b\">HP\u003c/text>\u003ctext x=\"705\" y=\"198\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">55\u003c/text>\u003ctext x=\"813\" y=\"170\" font-size=\"13\" fill=\"#64768b\">ATK\u003c/text>\u003ctext x=\"813\" y=\"198\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">12\u003c/text>\u003ctext x=\"921\" y=\"170\" font-size=\"13\" fill=\"#64768b\">보상\u003c/text>\u003ctext x=\"921\" y=\"198\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">30\u003c/text>\u003crect x=\"579\" y=\"237\" width=\"453\" height=\"10\" rx=\"5\" fill=\"#edf1f6\"/>\u003crect x=\"579\" y=\"237\" width=\"83.05\" height=\"10\" rx=\"5\" fill=\"#92b76a\"/>\u003crect x=\"24\" y=\"309\" width=\"501\" height=\"215\" rx=\"14\" fill=\"white\" stroke=\"#dce4ee\"/>\u003crect x=\"65\" y=\"368\" width=\"74\" height=\"62\" rx=\"17\" fill=\"#b29070\"/>\u003cpath d=\"M79 417L82 400L90 417M114 417L122 400L125 417\" fill=\"#fff6dc\"/>\u003cpath d=\"M77 390h16M111 390h16\" stroke=\"#24384a\" stroke-width=\"5\"/>\u003ctext x=\"174\" y=\"348\" font-size=\"23\" font-weight=\"700\" fill=\"#253d54\">3. 오크\u003c/text>\u003ctext x=\"174\" y=\"374\" font-size=\"15\" fill=\"#64768b\">폐광 · 새 전투는 최대 HP\u003c/text>\u003ctext x=\"174\" y=\"415\" font-size=\"13\" fill=\"#64768b\">HP\u003c/text>\u003ctext x=\"174\" y=\"443\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">110\u003c/text>\u003ctext x=\"282\" y=\"415\" font-size=\"13\" fill=\"#64768b\">ATK\u003c/text>\u003ctext x=\"282\" y=\"443\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">20\u003c/text>\u003ctext x=\"390\" y=\"415\" font-size=\"13\" fill=\"#64768b\">보상\u003c/text>\u003ctext x=\"390\" y=\"443\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">50\u003c/text>\u003crect x=\"48\" y=\"482\" width=\"453\" height=\"10\" rx=\"5\" fill=\"#edf1f6\"/>\u003crect x=\"48\" y=\"482\" width=\"166.1\" height=\"10\" rx=\"5\" fill=\"#b29070\"/>\u003crect x=\"555\" y=\"309\" width=\"501\" height=\"215\" rx=\"14\" fill=\"white\" stroke=\"#dce4ee\"/>\u003cpath d=\"M623 370L588 356L603 402L579 424L625 415L641 431L675 409L655 389L663 361L641 370Z\" fill=\"#cb786e\"/>\u003ccircle cx=\"645\" cy=\"390\" r=\"4\" fill=\"#fff6dc\"/>\u003ctext x=\"705\" y=\"348\" font-size=\"23\" font-weight=\"700\" fill=\"#253d54\">4. 드래곤\u003c/text>\u003ctext x=\"705\" y=\"374\" font-size=\"15\" fill=\"#64768b\">화산 · 새 전투는 최대 HP\u003c/text>\u003ctext x=\"705\" y=\"415\" font-size=\"13\" fill=\"#64768b\">HP\u003c/text>\u003ctext x=\"705\" y=\"443\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">300\u003c/text>\u003ctext x=\"813\" y=\"415\" font-size=\"13\" fill=\"#64768b\">ATK\u003c/text>\u003ctext x=\"813\" y=\"443\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">45\u003c/text>\u003ctext x=\"921\" y=\"415\" font-size=\"13\" fill=\"#64768b\">보상\u003c/text>\u003ctext x=\"921\" y=\"443\" font-size=\"24\" font-weight=\"700\" fill=\"#253d54\">120\u003c/text>\u003crect x=\"579\" y=\"482\" width=\"453\" height=\"10\" rx=\"5\" fill=\"#edf1f6\"/>\u003crect x=\"579\" y=\"482\" width=\"453.0\" height=\"10\" rx=\"5\" fill=\"#cb786e\"/>\u003c/svg>\u003c/figure>\u003ch2>도감은 기록이며 사냥은 새로운 만남입니다\u003c/h2>\u003cp>번호는 1부터 보여주고, 입력은 1~4만 허용합니다. 숫자가 아니거나 범위를 벗어나면 전투를 시작하지 않습니다. 같은 종을 다시 선택하면 항상 최대 HP의 \u003cstrong>새 전투 대상\u003c/strong>이 등장합니다. 이전 사냥의 남은 HP를 다음 사냥으로 가져오지 않습니다.\u003c/p>\u003cp>도감은 네 종을 고정 순서로 표시하고 각 종의 처치 여부를 보여줍니다. 같은 종을 여러 번 처치해도 도감에는 하나의 처치 표시만 필요합니다. 도감 완성 보상은 확장 과제이며 기본 기능이 아닙니다.\u003c/p>", "search": "05. 몬스터 도감과 전투 대상\n\n\u003c!-- SVG:monsters -->\n\n### 도감은 기록이며 사냥은 새로운 만남입니다\n\n번호는 1부터 보여주고, 입력은 1~4만 허용합니다. 숫자가 아니거나 범위를 벗어나면 전투를 시작하지 않습니다. 같은 종을 다시 선택하면 항상 최대 HP의 **새 전투 대상**이 등장합니다. 이전 사냥의 남은 HP를 다음 사냥으로 가져오지 않습니다.\n\n도감은 네 종을 고정 순서로 표시하고 각 종의 처치 여부를 보여줍니다. 같은 종을 여러 번 처치해도 도감에는 하나의 처치 표시만 필요합니다. 도감 완성 보상은 확장 과제이며 기본 기능이 아닙니다.\n\n"}, {"title": "06. 길드 가입·명단·검색·추방", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 416\" role=\"img\" aria-label=\"길드 기능의 입출력\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">길드 기능의 입출력\u003c/text>\u003cpath d=\"M348.0 134.0L378.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 134.0L732.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M540.0 204V228.0H540.0V252\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 322.0L732.0 322.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">가입 신청\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">기존 이름이면 중복 안내\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">레벨 2 · 처치 1 모두 검사\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">명단 표시\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">세라 · 도윤은 시작 시 등록\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">가입 순서대로 표시\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">정확한 이름 검색\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">입력: 세라 → 현재 상태\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">없는 이름 → 없음\u003c/text>\u003crect x=\"24.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#ffece7\" stroke=\"#a44232\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#a44232\"/>\u003ctext x=\"42.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#a44232\">조건 미달\u003c/text>\u003ctext x=\"42.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">부족한 레벨·처치 표시\u003c/text>\u003ctext x=\"42.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">상태를 바꾸지 않음\u003c/text>\u003crect x=\"378.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"396.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">추방\u003c/text>\u003ctext x=\"396.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">입력: 도윤 → 제거\u003c/text>\u003ctext x=\"396.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">없는 대상 → 실패 안내\u003c/text>\u003crect x=\"732.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"750.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">완료 확인\u003c/text>\u003ctext x=\"750.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">추방 후 명단에 없음\u003c/text>\u003ctext x=\"750.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">이름 검색 결과도 없음\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>가입과 관리의 규칙\u003c/h2>\u003cp>플레이어 가입에는 \u003cstrong>레벨 2 이상 AND 처치 수 1 이상\u003c/strong>이 필요합니다. 하나만 충족하면 거절하고 부족한 레벨과 처치 수를 0 이상 숫자로 안내합니다. 동일한 이름이 이미 등록되어 있으면 중복 가입으로 안내합니다. 이름 비교는 기본 문자열 비교이며 대소문자를 자동으로 통합하지 않습니다.\u003c/p>\u003cp>명단은 등록 순서를 유지합니다. 검색은 정확한 이름으로 한 명을 찾고, 없으면 없다고 안내합니다. 추방 성공 후 명단과 검색 결과 모두에서 사라져야 합니다. 없는 사람을 추방하려고 하면 실패 안내를 표시합니다.\u003c/p>\u003ch2>함께 쓰는 상태\u003c/h2>\u003cp>플레이어가 가입한 뒤 성장하면 명단과 검색에서도 현재 상태를 보아야 합니다. 가입 순간의 복사본으로 고정하는 기능은 아닙니다. 플레이어 자신을 추방하는 것도 현재 코드에서는 허용하며, 이후 조건을 만족하면 다시 가입 신청할 수 있습니다. 별도의 관리자 권한·강퇴 사유는 없습니다.\u003c/p>", "search": "06. 길드 가입·명단·검색·추방\n\n\u003c!-- SVG:guild -->\n\n### 가입과 관리의 규칙\n\n플레이어 가입에는 **레벨 2 이상 AND 처치 수 1 이상**이 필요합니다. 하나만 충족하면 거절하고 부족한 레벨과 처치 수를 0 이상 숫자로 안내합니다. 동일한 이름이 이미 등록되어 있으면 중복 가입으로 안내합니다. 이름 비교는 기본 문자열 비교이며 대소문자를 자동으로 통합하지 않습니다.\n\n명단은 등록 순서를 유지합니다. 검색은 정확한 이름으로 한 명을 찾고, 없으면 없다고 안내합니다. 추방 성공 후 명단과 검색 결과 모두에서 사라져야 합니다. 없는 사람을 추방하려고 하면 실패 안내를 표시합니다.\n\n### 함께 쓰는 상태\n\n플레이어가 가입한 뒤 성장하면 명단과 검색에서도 현재 상태를 보아야 합니다. 가입 순간의 복사본으로 고정하는 기능은 아닙니다. 플레이어 자신을 추방하는 것도 현재 코드에서는 허용하며, 이후 조건을 만족하면 다시 가입 신청할 수 있습니다. 별도의 관리자 권한·강퇴 사유는 없습니다.\n\n"}, {"title": "07. 열 개의 작은 기능을 게임으로 연결하기", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 238\" role=\"img\" aria-label=\"문법 데모의 기능을 하나의 플레이로 연결\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">문법 데모의 기능을 하나의 플레이로 연결\u003c/text>\u003cpath d=\"M348.0 139.0L378.0 139.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 139.0L732.0 139.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"150\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"126\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">입출력 + 변수\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">1 시작 화면 · 2 HP 교환\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">2번은 기본 메뉴 미연결\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"150\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"126\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">판단 + 반복 + 함수\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">3 가입 · 4 전직 · 5 반복\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">6 치명타 함수\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"150\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"126\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">클래스 + 자료구조\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">7 캐릭터 · 8 도감 배열\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">9 명단 List · 10 검색\u003c/text>\u003c/svg>\u003c/figure>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">번호\u003c/th>\u003cth scope=\"col\">작은 기능\u003c/th>\u003cth scope=\"col\">완성 게임에서의 역할\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>이름 입력과 증명서\u003c/td>\u003ctd>시작 화면과 캐릭터 생성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>두 캐릭터 HP 교환\u003c/td>\u003ctd>기본 메뉴 미연결. 확장 연습용 기능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>가입 조건 판단\u003c/td>\u003ctd>플레이어의 가입 허용 여부\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>조건에 따른 전직\u003c/td>\u003ctd>직업 선택과 상태 변경\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>끝날 때까지 반복\u003c/td>\u003ctd>메인 메뉴와 전투\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>치명타 계산\u003c/td>\u003ctd>모험가의 공격 피해\u003c/td>\u003c/tr>\u003ctr>\u003ctd>7\u003c/td>\u003ctd>값과 동작 묶기\u003c/td>\u003ctd>캐릭터·몬스터의 상태 관리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>고정 목록 순회\u003c/td>\u003ctd>몬스터 도감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>9\u003c/td>\u003ctd>목록에서 제거\u003c/td>\u003ctd>길드원 추방\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>이름으로 검색\u003c/td>\u003ctd>길드원 조회\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>체력 교환은 현재 메뉴에서 사용 가능한 스킬이 아닙니다. 기능이 준비되어 있는 것과 플레이 흐름에 연결된 것은 구별합니다. 확장하려면 대상 종류와 HP 상한 정책부터 새로 정해야 합니다.\u003c/p>", "search": "07. 열 개의 작은 기능을 게임으로 연결하기\n\n\u003c!-- SVG:learning -->\n\n| 번호 | 작은 기능 | 완성 게임에서의 역할 |\n| --- | --- | --- |\n| 1 | 이름 입력과 증명서 | 시작 화면과 캐릭터 생성 |\n| 2 | 두 캐릭터 HP 교환 | 기본 메뉴 미연결. 확장 연습용 기능 |\n| 3 | 가입 조건 판단 | 플레이어의 가입 허용 여부 |\n| 4 | 조건에 따른 전직 | 직업 선택과 상태 변경 |\n| 5 | 끝날 때까지 반복 | 메인 메뉴와 전투 |\n| 6 | 치명타 계산 | 모험가의 공격 피해 |\n| 7 | 값과 동작 묶기 | 캐릭터·몬스터의 상태 관리 |\n| 8 | 고정 목록 순회 | 몬스터 도감 |\n| 9 | 목록에서 제거 | 길드원 추방 |\n| 10 | 이름으로 검색 | 길드원 조회 |\n\n체력 교환은 현재 메뉴에서 사용 가능한 스킬이 아닙니다. 기능이 준비되어 있는 것과 플레이 흐름에 연결된 것은 구별합니다. 확장하려면 대상 종류와 HP 상한 정책부터 새로 정해야 합니다.\n\n"}, {"title": "08. 데모와 통합본의 차이", "body": "\u003ch2>이번 실습의 기준은 통합 게임입니다\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">항목\u003c/th>\u003cth scope=\"col\">개별 문법 데모\u003c/th>\u003cth scope=\"col\">통합 게임 기준\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>가입\u003c/td>\u003ctd>레벨 5, 처치 3\u003c/td>\u003ctd>레벨 2, 처치 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전직\u003c/td>\u003ctd>레벨 10과 힘·민첩·지능\u003c/td>\u003ctd>레벨·처치 수, 현재 직업\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시작 환영\u003c/td>\u003ctd>길드 일원이라는 문구\u003c/td>\u003ctd>캐릭터 생성 후 별도 가입 신청\u003c/td>\u003c/tr>\u003ctr>\u003ctd>몬스터\u003c/td>\u003ctd>일부 HP·공격력 값이 다름\u003c/td>\u003ctd>05단원의 네 종 수치\u003c/td>\u003c/tr>\u003ctr>\u003ctd>명단\u003c/td>\u003ctd>문자열 목록과 조건 삭제\u003c/td>\u003ctd>캐릭터 목록과 정확한 이름 추방\u003c/td>\u003c/tr>\u003ctr>\u003ctd>검색\u003c/td>\u003ctd>이름 → 직업·레벨 튜플\u003c/td>\u003ctd>이름 → 같은 캐릭터 객체\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>개별 데모는 해당 문법을 작게 보여주고, 통합본은 여러 기능을 함께 플레이하도록 수치를 조정한 것입니다. 데모의 숫자를 그대로 옮기면 문법이 맞아도 이번 기획과 다른 프로그램이 됩니다.\u003c/p>\u003ch2>완료 판정\u003c/h2>\u003cp>빈 이름의 기본값, 잘못된 메뉴, 조건 미달 가입, 두 번째 슬라임 처치 후 가입, 네 번째 슬라임 처치 후 기사 전직, 같은 이름 중복 가입, 기존 길드원 검색·추방, 반복 사냥의 새 HP, 패배 후 회복, 종료를 확인합니다. 코드의 파일 수가 맞는 것만으로 완성이라고 판단하지 않습니다.\u003c/p>", "search": "08. 데모와 통합본의 차이\n\n### 이번 실습의 기준은 통합 게임입니다\n\n| 항목 | 개별 문법 데모 | 통합 게임 기준 |\n| --- | --- | --- |\n| 가입 | 레벨 5, 처치 3 | 레벨 2, 처치 1 |\n| 전직 | 레벨 10과 힘·민첩·지능 | 레벨·처치 수, 현재 직업 |\n| 시작 환영 | 길드 일원이라는 문구 | 캐릭터 생성 후 별도 가입 신청 |\n| 몬스터 | 일부 HP·공격력 값이 다름 | 05단원의 네 종 수치 |\n| 명단 | 문자열 목록과 조건 삭제 | 캐릭터 목록과 정확한 이름 추방 |\n| 검색 | 이름 → 직업·레벨 튜플 | 이름 → 같은 캐릭터 객체 |\n\n개별 데모는 해당 문법을 작게 보여주고, 통합본은 여러 기능을 함께 플레이하도록 수치를 조정한 것입니다. 데모의 숫자를 그대로 옮기면 문법이 맞아도 이번 기획과 다른 프로그램이 됩니다.\n\n### 완료 판정\n\n빈 이름의 기본값, 잘못된 메뉴, 조건 미달 가입, 두 번째 슬라임 처치 후 가입, 네 번째 슬라임 처치 후 기사 전직, 같은 이름 중복 가입, 기존 길드원 검색·추방, 반복 사냥의 새 HP, 패배 후 회복, 종료를 확인합니다. 코드의 파일 수가 맞는 것만으로 완성이라고 판단하지 않습니다.\n"}];
const $=id=>document.getElementById(id);let completed=[],current=0;
try{const stored=JSON.parse(localStorage.getItem('textrpg-기획문서-completed')||'[]');if(Array.isArray(stored))completed=[...new Set(stored.filter(x=>Number.isInteger(x)&&x>=0&&x<chapters.length))];document.body.classList.toggle('dark',localStorage.getItem('csharp-first-theme')==='dark')}catch{}
function save(key,value){try{localStorage.setItem(key,value);return true}catch{$('status').textContent='브라우저 저장을 사용할 수 없습니다. 현재 화면에서는 학습을 계속할 수 있습니다.';return false}}
function themeLabel(){const dark=document.body.classList.contains('dark');$('theme').textContent=dark?'밝은 화면':'어두운 화면';$('theme').setAttribute('aria-pressed',String(dark))}
function toc(){const q=$('search').value.trim().toLocaleLowerCase();$('toc').replaceChildren();let count=0;chapters.forEach((c,i)=>{if(q&&!c.search.toLocaleLowerCase().includes(q))return;count++;const a=document.createElement('a');a.href='#lesson-'+(i+1);a.textContent=(completed.includes(i)?'✓ ':'')+c.title;if(i===current)a.setAttribute('aria-current','page');$('toc').append(a)});$('empty').hidden=count>0;$('progress').max=chapters.length;$('progress').value=completed.length;$('progressText').textContent=`학습 완료 ${completed.length} / ${chapters.length}`}
function show(){const match=location.hash.match(/^#lesson-(\d+)$/);const n=match?Number(match[1])-1:0;current=n>=0&&n<chapters.length?n:0;const c=chapters[current];$('title').textContent=c.title;document.title=c.title+' · TextRPG 기획문서';$('counter').textContent=`LESSON ${String(current+1).padStart(2,'0')} / ${chapters.length}`;$('content').innerHTML=c.body;$('prev').disabled=current===0;$('next').disabled=current===chapters.length-1;$('complete').textContent=completed.includes(current)?'✓ 완료됨 · 표시 취소':'학습 완료 표시';$('complete').setAttribute('aria-pressed',String(completed.includes(current)));$('status').textContent='';toc()}
function go(delta){location.hash='lesson-'+(current+1+delta)}
window.addEventListener('hashchange',()=>{show();window.scrollTo(0,0)});$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('search').oninput=toc;
$('complete').onclick=()=>{completed=completed.includes(current)?completed.filter(x=>x!==current):[...completed,current];show();save('textrpg-기획문서-completed',JSON.stringify(completed))};
$('theme').onclick=()=>{document.body.classList.toggle('dark');themeLabel();save('csharp-first-theme',document.body.classList.contains('dark')?'dark':'light')};
$('content').addEventListener('click',async event=>{const button=event.target.closest('.copy');if(!button)return;const code=button.closest('.code').querySelector('code').textContent;try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(code);$('status').textContent='코드를 복사했습니다. Program.cs에 붙여 넣으세요.'}catch{const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(button.closest('.code').querySelector('code'));selection.removeAllRanges();selection.addRange(range);$('status').textContent='코드를 선택했습니다. Ctrl+C로 복사하세요.'}});
themeLabel();show();
</script></body></html>
