<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 251" role="img" aria-label="기획 문장을 코드의 값·조건·동작으로 번역"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718399"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f8fc"/><text x="26" y="34" font-size="18" font-weight="700" fill="#263b51">기획 문장을 코드의 값·조건·동작으로 번역</text><path d="M348.0 145.5L378.0 145.5" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M702.0 145.5L732.0 145.5" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24.0" y="64" width="324.0" height="163" rx="12" fill="#e8f2ff" stroke="#235b91" stroke-opacity=".25"/><rect x="24.0" y="76" width="4" height="139" rx="2" fill="#235b91"/><text x="42.0" y="95" font-size="18" font-weight="700" fill="#235b91">기획: 처치를 기록한다</text><text x="42.0" y="123" font-size="15" fill="#354b61">몬스터를 이기면 1 증가</text><text x="42.0" y="147" font-size="15" fill="#354b61">그 뒤 성장 조건 판단</text><rect x="378.0" y="64" width="324.0" height="163" rx="12" fill="#fff2d8" stroke="#875818" stroke-opacity=".25"/><rect x="378.0" y="76" width="4" height="139" rx="2" fill="#875818"/><text x="396.0" y="95" font-size="18" font-weight="700" fill="#875818">값과 조건</text><text x="396.0" y="123" font-size="15" fill="#354b61">Kills++</text><text x="396.0" y="147" font-size="15" fill="#354b61">expReward &gt;= 30</text><text x="396.0" y="171" font-size="15" fill="#354b61">OR Kills % 2 == 0</text><rect x="732.0" y="64" width="324.0" height="163" rx="12" fill="#e6f5ee" stroke="#246e50" stroke-opacity=".25"/><rect x="732.0" y="76" width="4" height="139" rx="2" fill="#246e50"/><text x="750.0" y="95" font-size="18" font-weight="700" fill="#246e50">동작: 한 번 레벨업</text><text x="750.0" y="123" font-size="15" fill="#354b61">Level++ / MaxHp += 10</text><text x="750.0" y="147" font-size="15" fill="#354b61">Attack += 3 / Hp = MaxHp</text></svg>