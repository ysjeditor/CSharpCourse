<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 416" role="img" aria-label="길드의 자료구조 두 개는 같은 Character를 가리킵니다"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718399"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f8fc"/><text x="26" y="34" font-size="18" font-weight="700" fill="#263b51">길드의 자료구조 두 개는 같은 Character를 가리킵니다</text><path d="M348.0 134.0L378.0 134.0" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M732.0 134.0L702.0 134.0" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M348.0 322.0L378.0 322.0" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M702.0 322.0L732.0 322.0" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24.0" y="64" width="324.0" height="140" rx="12" fill="#e8f2ff" stroke="#235b91" stroke-opacity=".25"/><rect x="24.0" y="76" width="4" height="116" rx="2" fill="#235b91"/><text x="42.0" y="95" font-size="18" font-weight="700" fill="#235b91">List&lt;Character&gt;</text><text x="42.0" y="123" font-size="15" fill="#354b61">세라 → 도윤 → 아린</text><text x="42.0" y="147" font-size="15" fill="#354b61">순서 있는 명단</text><rect x="378.0" y="64" width="324.0" height="140" rx="12" fill="#f1eafb" stroke="#694595" stroke-opacity=".25"/><rect x="378.0" y="76" width="4" height="116" rx="2" fill="#694595"/><text x="396.0" y="95" font-size="18" font-weight="700" fill="#694595">Character 아린</text><text x="396.0" y="123" font-size="15" fill="#354b61">같은 객체 참조</text><text x="396.0" y="147" font-size="15" fill="#354b61">성장 후 상태도 함께 보임</text><rect x="732.0" y="64" width="324.0" height="140" rx="12" fill="#e6f5ee" stroke="#246e50" stroke-opacity=".25"/><rect x="732.0" y="76" width="4" height="116" rx="2" fill="#246e50"/><text x="750.0" y="95" font-size="18" font-weight="700" fill="#246e50">Dictionary&lt;string, Character&gt;</text><text x="750.0" y="123" font-size="15" fill="#354b61">키: 아린 → 값: Character</text><text x="750.0" y="147" font-size="15" fill="#354b61">정확한 이름 검색</text><rect x="24.0" y="252" width="324.0" height="140" rx="12" fill="#fff2d8" stroke="#875818" stroke-opacity=".25"/><rect x="24.0" y="264" width="4" height="116" rx="2" fill="#875818"/><text x="42.0" y="283" font-size="18" font-weight="700" fill="#875818">Join의 갱신</text><text x="42.0" y="311" font-size="15" fill="#354b61">List에 추가</text><text x="42.0" y="335" font-size="15" fill="#354b61">Dictionary에 키 등록</text><rect x="378.0" y="252" width="324.0" height="140" rx="12" fill="#ffece7" stroke="#a44232" stroke-opacity=".25"/><rect x="378.0" y="264" width="4" height="116" rx="2" fill="#a44232"/><text x="396.0" y="283" font-size="18" font-weight="700" fill="#a44232">Expel의 갱신</text><text x="396.0" y="311" font-size="15" fill="#354b61">검색한 객체를 List에서 제거</text><text x="396.0" y="335" font-size="15" fill="#354b61">Dictionary에서 키 제거</text><rect x="732.0" y="252" width="324.0" height="140" rx="12" fill="#e8f2ff" stroke="#235b91" stroke-opacity=".25"/><rect x="732.0" y="264" width="4" height="116" rx="2" fill="#235b91"/><text x="750.0" y="283" font-size="18" font-weight="700" fill="#235b91">검증할 일관성</text><text x="750.0" y="311" font-size="15" fill="#354b61">추방 후 Count 감소</text><text x="750.0" y="335" font-size="15" fill="#354b61">Find(name)는 null</text></svg>