<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 416" role="img" aria-label="길드 기능의 입출력"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#718399"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f8fc"/><text x="26" y="34" font-size="18" font-weight="700" fill="#263b51">길드 기능의 입출력</text><path d="M348.0 134.0L378.0 134.0" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M702.0 134.0L732.0 134.0" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M540.0 204V228.0H540.0V252" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M702.0 322.0L732.0 322.0" stroke="#718399" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="24.0" y="64" width="324.0" height="140" rx="12" fill="#e8f2ff" stroke="#235b91" stroke-opacity=".25"/><rect x="24.0" y="76" width="4" height="116" rx="2" fill="#235b91"/><text x="42.0" y="95" font-size="18" font-weight="700" fill="#235b91">가입 신청</text><text x="42.0" y="123" font-size="15" fill="#354b61">기존 이름이면 중복 안내</text><text x="42.0" y="147" font-size="15" fill="#354b61">레벨 2 · 처치 1 모두 검사</text><rect x="378.0" y="64" width="324.0" height="140" rx="12" fill="#e6f5ee" stroke="#246e50" stroke-opacity=".25"/><rect x="378.0" y="76" width="4" height="116" rx="2" fill="#246e50"/><text x="396.0" y="95" font-size="18" font-weight="700" fill="#246e50">명단 표시</text><text x="396.0" y="123" font-size="15" fill="#354b61">세라 · 도윤은 시작 시 등록</text><text x="396.0" y="147" font-size="15" fill="#354b61">가입 순서대로 표시</text><rect x="732.0" y="64" width="324.0" height="140" rx="12" fill="#fff2d8" stroke="#875818" stroke-opacity=".25"/><rect x="732.0" y="76" width="4" height="116" rx="2" fill="#875818"/><text x="750.0" y="95" font-size="18" font-weight="700" fill="#875818">정확한 이름 검색</text><text x="750.0" y="123" font-size="15" fill="#354b61">입력: 세라 → 현재 상태</text><text x="750.0" y="147" font-size="15" fill="#354b61">없는 이름 → 없음</text><rect x="24.0" y="252" width="324.0" height="140" rx="12" fill="#ffece7" stroke="#a44232" stroke-opacity=".25"/><rect x="24.0" y="264" width="4" height="116" rx="2" fill="#a44232"/><text x="42.0" y="283" font-size="18" font-weight="700" fill="#a44232">조건 미달</text><text x="42.0" y="311" font-size="15" fill="#354b61">부족한 레벨·처치 표시</text><text x="42.0" y="335" font-size="15" fill="#354b61">상태를 바꾸지 않음</text><rect x="378.0" y="252" width="324.0" height="140" rx="12" fill="#f1eafb" stroke="#694595" stroke-opacity=".25"/><rect x="378.0" y="264" width="4" height="116" rx="2" fill="#694595"/><text x="396.0" y="283" font-size="18" font-weight="700" fill="#694595">추방</text><text x="396.0" y="311" font-size="15" fill="#354b61">입력: 도윤 → 제거</text><text x="396.0" y="335" font-size="15" fill="#354b61">없는 대상 → 실패 안내</text><rect x="732.0" y="252" width="324.0" height="140" rx="12" fill="#e8f2ff" stroke="#235b91" stroke-opacity=".25"/><rect x="732.0" y="264" width="4" height="116" rx="2" fill="#235b91"/><text x="750.0" y="283" font-size="18" font-weight="700" fill="#235b91">완료 확인</text><text x="750.0" y="311" font-size="15" fill="#354b61">추방 후 명단에 없음</text><text x="750.0" y="335" font-size="15" fill="#354b61">이름 검색 결과도 없음</text></svg>