const chapters=[{"title": "01. 프로젝트 전체 구조", "body": "\u003ch2>진입점과 책임 분리\u003c/h2>\u003cp>기준 프로젝트는 \u003ccode>templates/TextRPG/src/projects/text-rpg\u003c/code>입니다. \u003ccode>Projects/test-rpg\u003c/code>라는 별도 경로는 확인되지 않아 이 통합 프로젝트를 대상으로 문서화했습니다. 정식 프로젝트의 8개 C# 파일에 선언된 \u003cstrong>클래스 6개, enum 1개, 최상위 진입 코드\u003c/strong>를 분석합니다.\u003c/p>\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 583\" role=\"img\" aria-label=\"클래스 책임 지도 · 화살표는 사용/호출이며 상속이 아닙니다\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">클래스 책임 지도 · 화살표는 사용/호출이며 상속이 아닙니다\u003c/text>\u003cpath d=\"M348.0 130.5L378.0 130.5\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 130.5L732.0 130.5\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M540.0 197V221.0H186.0V245\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M540.0 197V221.0H540.0V245\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M540.0 197V221.0H894.0V245\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M894.0 197V221.0H540.0V245\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M894.0 378V402.0H894.0V426\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">Program.cs\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">최상위 진입 코드\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">new Game().Run()\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">Game\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">시작 · 메뉴 · 기능 조립\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">hero / guild / codex 보유\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#ffece7\" stroke=\"#a44232\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#a44232\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#a44232\">Battle «static»\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Fight(hero, monster)\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">전투 처리 → bool 반환\u003c/text>\u003crect x=\"24.0\" y=\"245\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"257\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"42.0\" y=\"276\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">Guild\u003c/text>\u003ctext x=\"42.0\" y=\"304\" font-size=\"15\" fill=\"#354b61\">명단과 이름 색인\u003c/text>\u003ctext x=\"42.0\" y=\"328\" font-size=\"15\" fill=\"#354b61\">CanJoin / Join / Expel / Find\u003c/text>\u003crect x=\"378.0\" y=\"245\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"257\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"396.0\" y=\"276\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">Character\u003c/text>\u003ctext x=\"396.0\" y=\"304\" font-size=\"15\" fill=\"#354b61\">능력치 · 성장 · 전직\u003c/text>\u003ctext x=\"396.0\" y=\"328\" font-size=\"15\" fill=\"#354b61\">RollDamage / TakeDamage\u003c/text>\u003crect x=\"732.0\" y=\"245\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"257\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"750.0\" y=\"276\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">MonsterCodex\u003c/text>\u003ctext x=\"750.0\" y=\"304\" font-size=\"15\" fill=\"#354b61\">고정 도감 · 처치 집합\u003c/text>\u003ctext x=\"750.0\" y=\"328\" font-size=\"15\" fill=\"#354b61\">Spawn / MarkDefeated\u003c/text>\u003crect x=\"24.0\" y=\"426\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"438\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"42.0\" y=\"457\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">Job «enum»\u003c/text>\u003ctext x=\"42.0\" y=\"485\" font-size=\"15\" fill=\"#354b61\">모험가 / 기사\u003c/text>\u003ctext x=\"42.0\" y=\"509\" font-size=\"15\" fill=\"#354b61\">도적 / 마법사\u003c/text>\u003crect x=\"378.0\" y=\"426\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"438\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"457\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">보유와 전달\u003c/text>\u003ctext x=\"396.0\" y=\"485\" font-size=\"15\" fill=\"#354b61\">Game이 상태를 유지\u003c/text>\u003ctext x=\"396.0\" y=\"509\" font-size=\"15\" fill=\"#354b61\">Battle은 객체 참조를 받음\u003c/text>\u003crect x=\"732.0\" y=\"426\" width=\"324.0\" height=\"133\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"438\" width=\"4\" height=\"109\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"750.0\" y=\"457\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">Monster\u003c/text>\u003ctext x=\"750.0\" y=\"485\" font-size=\"15\" fill=\"#354b61\">도감 원본과 전투 사본\u003c/text>\u003ctext x=\"750.0\" y=\"509\" font-size=\"15\" fill=\"#354b61\">Clone / TakeDamage\u003c/text>\u003c/svg>\u003c/figure>\u003cp>\u003ccode>Program.cs\u003c/code>는 \u003ccode>new Game().Run();\u003c/code>으로 시작합니다. 소스에 명시적 Main이 없는 최상위 문 방식입니다. 이전 문서의 명시적 Main으로 바꿀 수 있지만 두 진입 방식을 함께 남기지 않습니다. 파일들은 \u003ccode>TextRpg\u003c/code> 네임스페이스를 사용하며 \u003ccode>Models\u003c/code>, \u003ccode>Systems\u003c/code>는 폴더 구분이지 별도 네임스페이스가 아닙니다.\u003c/p>\u003ch2>파일을 만드는 순서\u003c/h2>\u003cp>\u003ccode>Job → Character·Monster → MonsterCodex·Guild → Battle → Game → Program\u003c/code> 순서로 조립하면 의존하는 형식이 먼저 준비됩니다. 최종 템플릿은 .NET 10, Nullable 분석과 암시적 using을 사용합니다. 파일 범위 namespace는 C# 10 문법이므로 이전 C# 9 호환 문서와 환경이 다릅니다. 이번 실습은 콘솔 .NET 10 프로젝트 기준입니다.\u003c/p>", "search": "01. 프로젝트 전체 구조\n\n### 진입점과 책임 분리\n\n기준 프로젝트는 `templates/TextRPG/src/projects/text-rpg`입니다. `Projects/test-rpg`라는 별도 경로는 확인되지 않아 이 통합 프로젝트를 대상으로 문서화했습니다. 정식 프로젝트의 8개 C# 파일에 선언된 **클래스 6개, enum 1개, 최상위 진입 코드**를 분석합니다.\n\n\u003c!-- SVG:architecture -->\n\n`Program.cs`는 `new Game().Run();`으로 시작합니다. 소스에 명시적 Main이 없는 최상위 문 방식입니다. 이전 문서의 명시적 Main으로 바꿀 수 있지만 두 진입 방식을 함께 남기지 않습니다. 파일들은 `TextRpg` 네임스페이스를 사용하며 `Models`, `Systems`는 폴더 구분이지 별도 네임스페이스가 아닙니다.\n\n### 파일을 만드는 순서\n\n`Job → Character·Monster → MonsterCodex·Guild → Battle → Game → Program` 순서로 조립하면 의존하는 형식이 먼저 준비됩니다. 최종 템플릿은 .NET 10, Nullable 분석과 암시적 using을 사용합니다. 파일 범위 namespace는 C# 10 문법이므로 이전 C# 9 호환 문서와 환경이 다릅니다. 이번 실습은 콘솔 .NET 10 프로젝트 기준입니다.\n\n"}, {"title": "02. 모델의 값과 변경 통로", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 274\" role=\"img\" aria-label=\"모델의 핵심 계약 · private set은 내부 변경\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">모델의 핵심 계약 · private set은 내부 변경\u003c/text>\u003crect x=\"24.0\" y=\"64\" width=\"501.0\" height=\"186\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"162\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">Character\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Name: string { get; }\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">Level / Hp / Attack / Kills\u003c/text>\u003ctext x=\"42.0\" y=\"171\" font-size=\"15\" fill=\"#354b61\">IsAlive → Hp &gt; 0\u003c/text>\u003ctext x=\"42.0\" y=\"195\" font-size=\"15\" fill=\"#354b61\">성장 · 전직 · 피해 계산\u003c/text>\u003crect x=\"555.0\" y=\"64\" width=\"501.0\" height=\"186\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"555.0\" y=\"76\" width=\"4\" height=\"162\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"573.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">Monster\u003c/text>\u003ctext x=\"573.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Name / MaxHp / Attack\u003c/text>\u003ctext x=\"573.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">ExpReward / Habitat\u003c/text>\u003ctext x=\"573.0\" y=\"171\" font-size=\"15\" fill=\"#354b61\">Hp { get; private set; }\u003c/text>\u003ctext x=\"573.0\" y=\"195\" font-size=\"15\" fill=\"#354b61\">Clone은 MaxHp로 새 객체\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>Character의 계약\u003c/h2>\u003cp>이름은 읽기 전용이고 직업·레벨·최대 HP·현재 HP·공격력·처치 수는 클래스 내부에서 변경합니다. 생존 여부는 \u003ccode>Hp &gt; 0\u003c/code>으로 계산합니다. 신규 생성자는 이름과 선택적인 최대 HP·공격력을 받고, 추가 생성자는 기존 길드원 데이터를 받습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">멤버\u003c/th>\u003cth scope=\"col\">입력·출력\u003c/th>\u003cth scope=\"col\">책임\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>TakeDamage(int amount)\u003c/code>\u003c/td>\u003ctd>반환 없음\u003c/td>\u003ctd>HP를 0 이상으로 유지하며 감소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Heal()\u003c/code>\u003c/td>\u003ctd>반환 없음\u003c/td>\u003ctd>HP를 MaxHp로 복구\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>RollDamage(double critChance = 0.3, double critMultiplier = 1.5)\u003c/code>\u003c/td>\u003ctd>\u003ccode>(int damage, bool isCritical)\u003c/code>\u003c/td>\u003ctd>난수 판정과 피해 계산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>RecordKill(int expReward)\u003c/code>\u003c/td>\u003ctd>반환 없음\u003c/td>\u003ctd>처치 증가와 레벨·스탯 변경\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>TryChangeJob(Job wish, out string message)\u003c/code>\u003c/td>\u003ctd>bool + 안내\u003c/td>\u003ctd>조건 검사 후 전직\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SwapHpWith(Character other)\u003c/code>\u003c/td>\u003ctd>반환 없음\u003c/td>\u003ctd>두 Character의 HP 교환\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Describe()\u003c/code>\u003c/td>\u003ctd>string\u003c/td>\u003ctd>현재 상태를 문장으로 표현\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>음수 피해를 받으면 회복처럼 동작할 수 있으므로 TakeDamage가 모든 임의 입력을 검증한다고 해석하지 않습니다. 기본 전투는 양수 공격력을 사용합니다. SwapHpWith도 교환 후 최대 HP로 제한하지 않습니다. 공용 API로 확장할 때 추가할 검증과 현재 동작을 구별하세요.\u003c/p>\u003ch2>Monster와 Job\u003c/h2>\u003cp>Monster는 이름·최대 HP·공격력·보상·서식지를 읽기 전용으로 두고 HP만 내부에서 변경합니다. \u003ccode>Clone()\u003c/code>은 원본의 현재 HP가 아니라 \u003cstrong>MaxHp\u003c/strong>를 사용해 새 객체를 만듭니다. Job은 모험가·기사·도적·마법사의 enum입니다. Character와 Monster 사이의 상속 관계는 없습니다.\u003c/p>", "search": "02. 모델의 값과 변경 통로\n\n\u003c!-- SVG:models -->\n\n### Character의 계약\n\n이름은 읽기 전용이고 직업·레벨·최대 HP·현재 HP·공격력·처치 수는 클래스 내부에서 변경합니다. 생존 여부는 `Hp > 0`으로 계산합니다. 신규 생성자는 이름과 선택적인 최대 HP·공격력을 받고, 추가 생성자는 기존 길드원 데이터를 받습니다.\n\n| 멤버 | 입력·출력 | 책임 |\n| --- | --- | --- |\n| `TakeDamage(int amount)` | 반환 없음 | HP를 0 이상으로 유지하며 감소 |\n| `Heal()` | 반환 없음 | HP를 MaxHp로 복구 |\n| `RollDamage(double critChance = 0.3, double critMultiplier = 1.5)` | `(int damage, bool isCritical)` | 난수 판정과 피해 계산 |\n| `RecordKill(int expReward)` | 반환 없음 | 처치 증가와 레벨·스탯 변경 |\n| `TryChangeJob(Job wish, out string message)` | bool + 안내 | 조건 검사 후 전직 |\n| `SwapHpWith(Character other)` | 반환 없음 | 두 Character의 HP 교환 |\n| `Describe()` | string | 현재 상태를 문장으로 표현 |\n\n음수 피해를 받으면 회복처럼 동작할 수 있으므로 TakeDamage가 모든 임의 입력을 검증한다고 해석하지 않습니다. 기본 전투는 양수 공격력을 사용합니다. SwapHpWith도 교환 후 최대 HP로 제한하지 않습니다. 공용 API로 확장할 때 추가할 검증과 현재 동작을 구별하세요.\n\n### Monster와 Job\n\nMonster는 이름·최대 HP·공격력·보상·서식지를 읽기 전용으로 두고 HP만 내부에서 변경합니다. `Clone()`은 원본의 현재 HP가 아니라 **MaxHp**를 사용해 새 객체를 만듭니다. Job은 모험가·기사·도적·마법사의 enum입니다. Character와 Monster 사이의 상속 관계는 없습니다.\n\n"}, {"title": "03. 도감 원본과 전투 사본", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 228\" role=\"img\" aria-label=\"도감과 사냥 대상의 객체를 구분\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">도감과 사냥 대상의 객체를 구분\u003c/text>\u003cpath d=\"M348.0 134.0L378.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 134.0L732.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">도감 배열 원본\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">_monsters[0] = 슬라임\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">MaxHp 30 / Hp 30\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">Spawn(0) → Clone()\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">새 Monster 생성\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">원본과 다른 참조\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#ffece7\" stroke=\"#a44232\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#a44232\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#a44232\">전투 사본\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">TakeDamage(15)\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">Hp 15 → 원본 Hp는 30\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>MonsterCodex가 보유하는 것\u003c/h2>\u003cp>고정 데이터는 \u003ccode>Monster[] _monsters\u003c/code>, 처치한 종 이름은 \u003ccode>HashSet&lt;string&gt; _defeated\u003c/code>입니다. \u003ccode>Count\u003c/code>는 배열 길이이고 인덱서 \u003ccode>this[int index]\u003c/code>는 해당 원본 객체를 돌려줍니다. 읽기용 프로퍼티라고 해서 반환한 객체 자체가 불변은 아닙니다.\u003c/p>\u003cp>\u003ccode>Spawn(int index)\u003c/code>는 \u003ccode>Clone()\u003c/code>으로 전투 사본을 반환합니다. UI에서 고른 1~4를 배열 인덱스 0~3으로 바꾸는 것은 Game.Hunt의 책임입니다. Spawn 자체에는 입력 범위 검사가 없습니다.\u003c/p>\u003ch2>화면 번호를 코드로 바꾸기\u003c/h2>\u003col>\u003cli>\u003ccode>int.TryParse\u003c/code>로 숫자 입력을 확인합니다.\u003c/li>\u003cli>1 이상이고 Count 이하인지 확인합니다.\u003c/li>\u003cli>\u003ccode>Spawn(pick - 1)\u003c/code>으로 전투 대상을 생성합니다.\u003c/li>\u003cli>승리 후 \u003ccode>MarkDefeated(monster.Name)\u003c/code>로 종의 처치를 기록합니다.\u003c/li>\u003c/ol>\u003cp>번호를 빼기 전에 검증합니다. 도감 원본을 Battle에 바로 넘기면 전투 피해가 원본에 누적될 수 있습니다. 사본과 원본의 역할을 테스트로 구분하세요.\u003c/p>", "search": "03. 도감 원본과 전투 사본\n\n\u003c!-- SVG:clone -->\n\n### MonsterCodex가 보유하는 것\n\n고정 데이터는 `Monster[] _monsters`, 처치한 종 이름은 `HashSet\u003cstring> _defeated`입니다. `Count`는 배열 길이이고 인덱서 `this[int index]`는 해당 원본 객체를 돌려줍니다. 읽기용 프로퍼티라고 해서 반환한 객체 자체가 불변은 아닙니다.\n\n`Spawn(int index)`는 `Clone()`으로 전투 사본을 반환합니다. UI에서 고른 1~4를 배열 인덱스 0~3으로 바꾸는 것은 Game.Hunt의 책임입니다. Spawn 자체에는 입력 범위 검사가 없습니다.\n\n### 화면 번호를 코드로 바꾸기\n\n1. `int.TryParse`로 숫자 입력을 확인합니다.\n2. 1 이상이고 Count 이하인지 확인합니다.\n3. `Spawn(pick - 1)`으로 전투 대상을 생성합니다.\n4. 승리 후 `MarkDefeated(monster.Name)`로 종의 처치를 기록합니다.\n\n번호를 빼기 전에 검증합니다. 도감 원본을 Battle에 바로 넘기면 전투 피해가 원본에 누적될 수 있습니다. 사본과 원본의 역할을 테스트로 구분하세요.\n\n"}, {"title": "04. 전투 호출과 반환", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 416\" role=\"img\" aria-label=\"사냥의 호출 흐름 · 아래 기능은 순차적으로 연결됩니다\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">사냥의 호출 흐름 · 아래 기능은 순차적으로 연결됩니다\u003c/text>\u003cpath d=\"M348.0 134.0L378.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 134.0L732.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M894.0 204V228.0H186.0V252\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M348.0 322.0L378.0 322.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M894.0 204V228.0H894.0V252\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">Game.Hunt\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">번호 입력·검증\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">1부터 Count → pick - 1\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">MonsterCodex.Spawn\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">원본 Clone\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">새 Monster 반환\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#ffece7\" stroke=\"#a44232\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#a44232\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#a44232\">Battle.Fight\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">RollDamage → TakeDamage\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">영웅 생존 여부 반환\u003c/text>\u003crect x=\"24.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"42.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">승리: MarkDefeated\u003c/text>\u003ctext x=\"42.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">HashSet에 종 이름 추가\u003c/text>\u003ctext x=\"42.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">같은 종은 중복 저장 안 함\u003c/text>\u003crect x=\"378.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"396.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">승리: RecordKill\u003c/text>\u003ctext x=\"396.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">Kills +1 → 성장 조건 검사\u003c/text>\u003ctext x=\"396.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">스탯 변경 후 Describe\u003c/text>\u003crect x=\"732.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"750.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">패배: Heal\u003c/text>\u003ctext x=\"750.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">HP = MaxHp\u003c/text>\u003ctext x=\"750.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">보상 없이 메뉴로\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>Battle.Fight는 전투만 처리합니다\u003c/h2>\u003cp>\u003ccode>Battle\u003c/code>은 정적 클래스이며 \u003ccode>Fight(Character hero, Monster monster)\u003c/code>가 bool을 반환합니다. 별도 Battle 객체를 생성하지 않습니다. 영웅과 몬스터 객체는 전달받은 참조이므로 HP 변경은 같은 객체에 반영됩니다.\u003c/p>\u003cp>전투는 생존 조건을 검사하면서 영웅 공격 → 몬스터 사망 확인 → 생존 시 반격을 반복합니다. 영웅이 살아남으면 true를 반환합니다. 실제 게임은 살아 있는 새 몬스터와 회복 가능한 영웅을 전달합니다. 임의의 사망 객체를 전달했을 때까지 전투 계약이 검증되어 있는 것은 아닙니다.\u003c/p>\u003ch2>승패 이후는 Game.Hunt의 책임\u003c/h2>\u003cp>승리 후 도감 표시와 RecordKill을 호출하는 것은 Game입니다. 패배 후 Heal도 Game에서 호출합니다. Battle 안에서 보상까지 지급하면 Game의 처리와 중복될 수 있습니다. \u003cstrong>호출이 끝나서 돌아오는 자리에서 다음 책임을 연결\u003c/strong>하는 연습입니다.\u003c/p>\u003ch2>치명타의 검증\u003c/h2>\u003cp>Character는 정적 Random을 사용합니다. 기본 호출의 피해가 항상 같다고 테스트하지 않습니다. \u003ccode>RollDamage(critChance: 0)\u003c/code>은 일반 피해, \u003ccode>RollDamage(critChance: 1)\u003c/code>은 치명타로 확인할 수 있습니다. 통합 전투에서는 한 방에 처치 가능한 공격력의 테스트 캐릭터를 사용하면 ‘처치 후 반격 없음’을 결정적으로 확인할 수 있습니다.\u003c/p>", "search": "04. 전투 호출과 반환\n\n\u003c!-- SVG:sequence -->\n\n### Battle.Fight는 전투만 처리합니다\n\n`Battle`은 정적 클래스이며 `Fight(Character hero, Monster monster)`가 bool을 반환합니다. 별도 Battle 객체를 생성하지 않습니다. 영웅과 몬스터 객체는 전달받은 참조이므로 HP 변경은 같은 객체에 반영됩니다.\n\n전투는 생존 조건을 검사하면서 영웅 공격 → 몬스터 사망 확인 → 생존 시 반격을 반복합니다. 영웅이 살아남으면 true를 반환합니다. 실제 게임은 살아 있는 새 몬스터와 회복 가능한 영웅을 전달합니다. 임의의 사망 객체를 전달했을 때까지 전투 계약이 검증되어 있는 것은 아닙니다.\n\n### 승패 이후는 Game.Hunt의 책임\n\n승리 후 도감 표시와 RecordKill을 호출하는 것은 Game입니다. 패배 후 Heal도 Game에서 호출합니다. Battle 안에서 보상까지 지급하면 Game의 처리와 중복될 수 있습니다. **호출이 끝나서 돌아오는 자리에서 다음 책임을 연결**하는 연습입니다.\n\n### 치명타의 검증\n\nCharacter는 정적 Random을 사용합니다. 기본 호출의 피해가 항상 같다고 테스트하지 않습니다. `RollDamage(critChance: 0)`은 일반 피해, `RollDamage(critChance: 1)`은 치명타로 확인할 수 있습니다. 통합 전투에서는 한 방에 처치 가능한 공격력의 테스트 캐릭터를 사용하면 ‘처치 후 반격 없음’을 결정적으로 확인할 수 있습니다.\n\n"}, {"title": "05. 성장·전직을 코드로 번역하기", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 251\" role=\"img\" aria-label=\"기획 문장을 코드의 값·조건·동작으로 번역\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">기획 문장을 코드의 값·조건·동작으로 번역\u003c/text>\u003cpath d=\"M348.0 145.5L378.0 145.5\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 145.5L732.0 145.5\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"163\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"139\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">기획: 처치를 기록한다\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">몬스터를 이기면 1 증가\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">그 뒤 성장 조건 판단\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"163\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"139\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">값과 조건\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Kills++\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">expReward &gt;= 30\u003c/text>\u003ctext x=\"396.0\" y=\"171\" font-size=\"15\" fill=\"#354b61\">OR Kills % 2 == 0\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"163\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"139\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">동작: 한 번 레벨업\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">Level++ / MaxHp += 10\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">Attack += 3 / Hp = MaxHp\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>규칙 문장을 작은 연산으로 나누기\u003c/h2>\u003cp>‘큰 보상의 몬스터 또는 짝수 번째 처치에서 성장’은 처치 수를 먼저 증가시킨 후 \u003ccode>expReward &gt;= 30 || Kills % 2 == 0\u003c/code>을 검사합니다. \u003ccode>if\u003c/code> 한 번이므로 동시 충족해도 레벨은 한 번 증가합니다. Exp라는 누적 필드를 새로 만들면 현재 프로젝트와 다른 성장 시스템이 됩니다.\u003c/p>\u003ch2>TryChangeJob의 처리 순서\u003c/h2>\u003col>\u003cli>현재 직업이 모험가인지 확인합니다.\u003c/li>\u003cli>공통 레벨 3 이상인지 확인합니다.\u003c/li>\u003cli>switch 식으로 희망 직업별 조건을 검사합니다.\u003c/li>\u003cli>실패하면 안내를 채우고 false를 반환합니다.\u003c/li>\u003cli>성공하면 직업·최대 HP·공격력·HP를 변경하고 true를 반환합니다.\u003c/li>\u003c/ol>\u003cp>실패 검사가 끝나기 전에 보너스를 적용하지 않습니다. 모든 반환 경로에서 \u003ccode>out message\u003c/code>에 값을 넣어야 합니다. 직업 선택 입력을 Job?로 바꾸고 잘못된 선택을 걸러내는 책임은 Game.ChangeJob에 있습니다.\u003c/p>", "search": "05. 성장·전직을 코드로 번역하기\n\n\u003c!-- SVG:translation -->\n\n### 규칙 문장을 작은 연산으로 나누기\n\n‘큰 보상의 몬스터 또는 짝수 번째 처치에서 성장’은 처치 수를 먼저 증가시킨 후 `expReward >= 30 || Kills % 2 == 0`을 검사합니다. `if` 한 번이므로 동시 충족해도 레벨은 한 번 증가합니다. Exp라는 누적 필드를 새로 만들면 현재 프로젝트와 다른 성장 시스템이 됩니다.\n\n### TryChangeJob의 처리 순서\n\n1. 현재 직업이 모험가인지 확인합니다.\n2. 공통 레벨 3 이상인지 확인합니다.\n3. switch 식으로 희망 직업별 조건을 검사합니다.\n4. 실패하면 안내를 채우고 false를 반환합니다.\n5. 성공하면 직업·최대 HP·공격력·HP를 변경하고 true를 반환합니다.\n\n실패 검사가 끝나기 전에 보너스를 적용하지 않습니다. 모든 반환 경로에서 `out message`에 값을 넣어야 합니다. 직업 선택 입력을 Job?로 바꾸고 잘못된 선택을 걸러내는 책임은 Game.ChangeJob에 있습니다.\n\n"}, {"title": "06. 길드의 두 자료구조와 가입 경계", "body": "\u003cfigure class=\"diagram\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1080 416\" role=\"img\" aria-label=\"길드의 자료구조 두 개는 같은 Character를 가리킵니다\">\u003cdefs>\u003cmarker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\u003cpath d=\"M0 0L10 5L0 10Z\" fill=\"#718399\"/>\u003c/marker>\u003c/defs>\u003crect width=\"100%\" height=\"100%\" rx=\"14\" fill=\"#f6f8fc\"/>\u003ctext x=\"26\" y=\"34\" font-size=\"18\" font-weight=\"700\" fill=\"#263b51\">길드의 자료구조 두 개는 같은 Character를 가리킵니다\u003c/text>\u003cpath d=\"M348.0 134.0L378.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M732.0 134.0L702.0 134.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M348.0 322.0L378.0 322.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003cpath d=\"M702.0 322.0L732.0 322.0\" stroke=\"#718399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arrow)\"/>\u003crect x=\"24.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"42.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">List&lt;Character&gt;\u003c/text>\u003ctext x=\"42.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">세라 → 도윤 → 아린\u003c/text>\u003ctext x=\"42.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">순서 있는 명단\u003c/text>\u003crect x=\"378.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#f1eafb\" stroke=\"#694595\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#694595\"/>\u003ctext x=\"396.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#694595\">Character 아린\u003c/text>\u003ctext x=\"396.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">같은 객체 참조\u003c/text>\u003ctext x=\"396.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">성장 후 상태도 함께 보임\u003c/text>\u003crect x=\"732.0\" y=\"64\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e6f5ee\" stroke=\"#246e50\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"76\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#246e50\"/>\u003ctext x=\"750.0\" y=\"95\" font-size=\"18\" font-weight=\"700\" fill=\"#246e50\">Dictionary&lt;string, Character&gt;\u003c/text>\u003ctext x=\"750.0\" y=\"123\" font-size=\"15\" fill=\"#354b61\">키: 아린 → 값: Character\u003c/text>\u003ctext x=\"750.0\" y=\"147\" font-size=\"15\" fill=\"#354b61\">정확한 이름 검색\u003c/text>\u003crect x=\"24.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#fff2d8\" stroke=\"#875818\" stroke-opacity=\".25\"/>\u003crect x=\"24.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#875818\"/>\u003ctext x=\"42.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#875818\">Join의 갱신\u003c/text>\u003ctext x=\"42.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">List에 추가\u003c/text>\u003ctext x=\"42.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">Dictionary에 키 등록\u003c/text>\u003crect x=\"378.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#ffece7\" stroke=\"#a44232\" stroke-opacity=\".25\"/>\u003crect x=\"378.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#a44232\"/>\u003ctext x=\"396.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#a44232\">Expel의 갱신\u003c/text>\u003ctext x=\"396.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">검색한 객체를 List에서 제거\u003c/text>\u003ctext x=\"396.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">Dictionary에서 키 제거\u003c/text>\u003crect x=\"732.0\" y=\"252\" width=\"324.0\" height=\"140\" rx=\"12\" fill=\"#e8f2ff\" stroke=\"#235b91\" stroke-opacity=\".25\"/>\u003crect x=\"732.0\" y=\"264\" width=\"4\" height=\"116\" rx=\"2\" fill=\"#235b91\"/>\u003ctext x=\"750.0\" y=\"283\" font-size=\"18\" font-weight=\"700\" fill=\"#235b91\">검증할 일관성\u003c/text>\u003ctext x=\"750.0\" y=\"311\" font-size=\"15\" fill=\"#354b61\">추방 후 Count 감소\u003c/text>\u003ctext x=\"750.0\" y=\"335\" font-size=\"15\" fill=\"#354b61\">Find(name)는 null\u003c/text>\u003c/svg>\u003c/figure>\u003ch2>순서와 이름 검색을 함께 만족하기\u003c/h2>\u003cp>\u003ccode>List&lt;Character&gt; _members\u003c/code>는 순서 있는 명단을, \u003ccode>Dictionary&lt;string, Character&gt; _byName\u003c/code>은 이름 검색을 담당합니다. 두 곳에 같은 Character 참조를 넣습니다. 값의 복제본을 각각 만들어 넣지 않습니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">메서드\u003c/th>\u003cth scope=\"col\">실제 책임\u003c/th>\u003cth scope=\"col\">호출할 때 주의할 점\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>CanJoin(Character c, out string reason)\u003c/code>\u003c/td>\u003ctd>레벨·처치 조건 계산\u003c/td>\u003ctd>등록하지 않음. 중복 확인도 하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Join(Character c)\u003c/code>\u003c/td>\u003ctd>이름 중복 방지 후 두 구조 등록\u003c/td>\u003ctd>가입 조건을 내부에서 검사하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Find(string name)\u003c/code>\u003c/td>\u003ctd>이름 검색 후 Character? 반환\u003c/td>\u003ctd>없으면 null\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Expel(string name)\u003c/code>\u003c/td>\u003ctd>찾은 객체와 키를 두 구조에서 제거\u003c/td>\u003ctd>없으면 false\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PrintRoster()\u003c/code>\u003c/td>\u003ctd>등록 순서로 Describe 출력\u003c/td>\u003ctd>빈 명단 안내 포함\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>가입 기능 전체의 책임은 호출 순서에 있습니다\u003c/h2>\u003cp>플레이어 가입 메뉴는 \u003cstrong>Find로 중복 확인 → CanJoin → Join\u003c/strong> 순서로 조립합니다. 기존 길드원 시드 등록은 Join을 직접 호출합니다. Join 하나만 연결해두고 가입 자격까지 검사된다고 생각하면 조건 미달 캐릭터가 등록됩니다.\u003c/p>\u003cp>추방은 List만 지우거나 Dictionary만 지우지 않습니다. 삭제 후 Count와 Find를 모두 확인하세요. 조회 결과는 같은 Character이므로 플레이어 성장과 길드 명단의 상태가 연결됩니다.\u003c/p>", "search": "06. 길드의 두 자료구조와 가입 경계\n\n\u003c!-- SVG:storage -->\n\n### 순서와 이름 검색을 함께 만족하기\n\n`List\u003cCharacter> _members`는 순서 있는 명단을, `Dictionary\u003cstring, Character> _byName`은 이름 검색을 담당합니다. 두 곳에 같은 Character 참조를 넣습니다. 값의 복제본을 각각 만들어 넣지 않습니다.\n\n| 메서드 | 실제 책임 | 호출할 때 주의할 점 |\n| --- | --- | --- |\n| `CanJoin(Character c, out string reason)` | 레벨·처치 조건 계산 | 등록하지 않음. 중복 확인도 하지 않음 |\n| `Join(Character c)` | 이름 중복 방지 후 두 구조 등록 | 가입 조건을 내부에서 검사하지 않음 |\n| `Find(string name)` | 이름 검색 후 Character? 반환 | 없으면 null |\n| `Expel(string name)` | 찾은 객체와 키를 두 구조에서 제거 | 없으면 false |\n| `PrintRoster()` | 등록 순서로 Describe 출력 | 빈 명단 안내 포함 |\n\n### 가입 기능 전체의 책임은 호출 순서에 있습니다\n\n플레이어 가입 메뉴는 **Find로 중복 확인 → CanJoin → Join** 순서로 조립합니다. 기존 길드원 시드 등록은 Join을 직접 호출합니다. Join 하나만 연결해두고 가입 자격까지 검사된다고 생각하면 조건 미달 캐릭터가 등록됩니다.\n\n추방은 List만 지우거나 Dictionary만 지우지 않습니다. 삭제 후 Count와 Find를 모두 확인하세요. 조회 결과는 같은 Character이므로 플레이어 성장과 길드 명단의 상태가 연결됩니다.\n\n"}, {"title": "07. Game이 전체 흐름을 조립하는 방법", "body": "\u003ch2>Game이 보유하는 상태\u003c/h2>\u003cp>Game은 도감 하나와 길드 하나를 생성해 필드로 보관하고, StartScreen 결과를 \u003ccode>_hero\u003c/code>에 저장합니다. 사냥할 때마다 Game·Guild를 새로 만들면 기존 플레이 상태가 사라지므로 수명을 구분해야 합니다.\u003c/p>\u003cp>\u003ccode>Run()\u003c/code>은 시작 화면 → 기존 길드원 등록 → 메뉴 반복 → 종료 메시지 순서입니다. 메인 메뉴에서 문자열을 Trim한 뒤 switch로 기능을 선택합니다. EOF이면 반복을 종료합니다.\u003c/p>\u003ch2>메서드 분담\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Game 메서드\u003c/th>\u003cth scope=\"col\">호출하는 협력자\u003c/th>\u003cth scope=\"col\">처리하는 사용자 흐름\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>StartScreen()\u003c/code>\u003c/td>\u003ctd>Character 생성자\u003c/td>\u003ctd>이름 정리와 캐릭터 생성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SeedGuild()\u003c/code>\u003c/td>\u003ctd>Guild.Join\u003c/td>\u003ctd>세라·도윤 초기 등록\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Hunt()\u003c/code>\u003c/td>\u003ctd>Codex, Battle, Character\u003c/td>\u003ctd>입력 검증과 전투 후 처리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ChangeJob()\u003c/code>\u003c/td>\u003ctd>Character.TryChangeJob\u003c/td>\u003ctd>선택 변환과 성공·실패 표시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>JoinGuild()\u003c/code>\u003c/td>\u003ctd>Guild.Find, CanJoin, Join\u003c/td>\u003ctd>중복·자격 확인 후 가입\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ManageGuild()\u003c/code>\u003c/td>\u003ctd>Guild.PrintRoster, Find, Expel\u003c/td>\u003ctd>한 번의 관리 작업\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PrintMenu()\u003c/code>\u003c/td>\u003ctd>콘솔\u003c/td>\u003ctd>메뉴 출력\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003ccode>Game\u003c/code>을 모든 규칙을 담는 거대한 클래스로 만들지 않습니다. 화면을 넘기는 순서는 Game, 캐릭터 변경 규칙은 Character, 명단 일관성은 Guild가 맡습니다.\u003c/p>", "search": "07. Game이 전체 흐름을 조립하는 방법\n\n### Game이 보유하는 상태\n\nGame은 도감 하나와 길드 하나를 생성해 필드로 보관하고, StartScreen 결과를 `_hero`에 저장합니다. 사냥할 때마다 Game·Guild를 새로 만들면 기존 플레이 상태가 사라지므로 수명을 구분해야 합니다.\n\n`Run()`은 시작 화면 → 기존 길드원 등록 → 메뉴 반복 → 종료 메시지 순서입니다. 메인 메뉴에서 문자열을 Trim한 뒤 switch로 기능을 선택합니다. EOF이면 반복을 종료합니다.\n\n### 메서드 분담\n\n| Game 메서드 | 호출하는 협력자 | 처리하는 사용자 흐름 |\n| --- | --- | --- |\n| `StartScreen()` | Character 생성자 | 이름 정리와 캐릭터 생성 |\n| `SeedGuild()` | Guild.Join | 세라·도윤 초기 등록 |\n| `Hunt()` | Codex, Battle, Character | 입력 검증과 전투 후 처리 |\n| `ChangeJob()` | Character.TryChangeJob | 선택 변환과 성공·실패 표시 |\n| `JoinGuild()` | Guild.Find, CanJoin, Join | 중복·자격 확인 후 가입 |\n| `ManageGuild()` | Guild.PrintRoster, Find, Expel | 한 번의 관리 작업 |\n| `PrintMenu()` | 콘솔 | 메뉴 출력 |\n\n`Game`을 모든 규칙을 담는 거대한 클래스로 만들지 않습니다. 화면을 넘기는 순서는 Game, 캐릭터 변경 규칙은 Character, 명단 일관성은 Guild가 맡습니다.\n\n"}, {"title": "08. 문서에서 파일로 옮기는 실습", "body": "\u003ch2>문장을 코드 요소로 분류하기\u003c/h2>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">기획 표현\u003c/th>\u003cth scope=\"col\">코드 요소\u003c/th>\u003cth scope=\"col\">실제 예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>기억할 숫자·문자\u003c/td>\u003ctd>필드·프로퍼티\u003c/td>\u003ctd>Hp, Level, Name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>정해진 선택지\u003c/td>\u003ctd>enum\u003c/td>\u003ctd>Job\u003c/td>\u003c/tr>\u003ctr>\u003ctd>허용 조건\u003c/td>\u003ctd>bool 식\u003c/td>\u003ctd>levelOk &amp;&amp; killsOk\u003c/td>\u003c/tr>\u003ctr>\u003ctd>입력받아 결과 만들기\u003c/td>\u003ctd>메서드\u003c/td>\u003ctd>RollDamage, TryChangeJob\u003c/td>\u003c/tr>\u003ctr>\u003ctd>여러 고정 항목\u003c/td>\u003ctd>배열\u003c/td>\u003ctd>Monster[]\u003c/td>\u003c/tr>\u003ctr>\u003ctd>늘고 줄어드는 명단\u003c/td>\u003ctd>List\u003c/td>\u003ctd>_members\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이름으로 조회\u003c/td>\u003ctd>Dictionary\u003c/td>\u003ctd>_byName\u003c/td>\u003c/tr>\u003ctr>\u003ctd>중복 없는 처치 기록\u003c/td>\u003ctd>HashSet\u003c/td>\u003ctd>_defeated\u003c/td>\u003c/tr>\u003ctr>\u003ctd>계속할 작업과 종료 조건\u003c/td>\u003ctd>while와 switch\u003c/td>\u003ctd>Run, Fight\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch2>구현 순서와 확인\u003c/h2>\u003cp>먼저 빈 콘솔 프로젝트에 8개 파일 경로를 만듭니다. 데이터 생성과 Describe부터 실행해본 뒤 HP 변경, 도감, 길드, 전직·성장, 전투를 순서대로 추가합니다. 모든 파일을 한꺼번에 복사하는 대신 \u003cstrong>한 단계마다 빌드하고 확인한 사실을 기록\u003c/strong>합니다. 세부 과제와 체크리스트는 두 문서 보기 화면에서 선택할 수 있습니다.\u003c/p>\u003cp>최종 템플릿에는 명시적인 인터페이스·리플렉션·비동기 처리 구조가 없습니다. 이번 과제에서는 필요 없는 중간 계층을 추가하기보다 실제 클래스 간 데이터와 반환값 연결을 먼저 완성합니다.\u003c/p>", "search": "08. 문서에서 파일로 옮기는 실습\n\n### 문장을 코드 요소로 분류하기\n\n| 기획 표현 | 코드 요소 | 실제 예 |\n| --- | --- | --- |\n| 기억할 숫자·문자 | 필드·프로퍼티 | Hp, Level, Name |\n| 정해진 선택지 | enum | Job |\n| 허용 조건 | bool 식 | levelOk && killsOk |\n| 입력받아 결과 만들기 | 메서드 | RollDamage, TryChangeJob |\n| 여러 고정 항목 | 배열 | Monster[] |\n| 늘고 줄어드는 명단 | List | _members |\n| 이름으로 조회 | Dictionary | _byName |\n| 중복 없는 처치 기록 | HashSet | _defeated |\n| 계속할 작업과 종료 조건 | while와 switch | Run, Fight |\n\n### 구현 순서와 확인\n\n먼저 빈 콘솔 프로젝트에 8개 파일 경로를 만듭니다. 데이터 생성과 Describe부터 실행해본 뒤 HP 변경, 도감, 길드, 전직·성장, 전투를 순서대로 추가합니다. 모든 파일을 한꺼번에 복사하는 대신 **한 단계마다 빌드하고 확인한 사실을 기록**합니다. 세부 과제와 체크리스트는 두 문서 보기 화면에서 선택할 수 있습니다.\n\n최종 템플릿에는 명시적인 인터페이스·리플렉션·비동기 처리 구조가 없습니다. 이번 과제에서는 필요 없는 중간 계층을 추가하기보다 실제 클래스 간 데이터와 반환값 연결을 먼저 완성합니다.\n\n"}, {"title": "09. 실제 코드와 대조하기", "body": "\u003ch2>구현을 마친 후 확인\u003c/h2>\u003cp>아래 파일별 원본은 문서 생성 시점의 프로젝트 코드입니다. 먼저 두 문서의 계약으로 구현하고, 막힌 부분이나 책임 배분을 확인할 때 펼쳐봅니다. 전부 복사하여 실행되는 것과 \u003cstrong>기획의 어느 문장이 어느 메서드로 바뀌었는지 설명하는 것\u003c/strong>을 구분하세요.\u003c/p>\u003cdetails class=\"source-file\">\u003csummary>Game.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>namespace TextRpg;\n\n/// 10개 실습 기능을 하나로 엮은, 실제로 플레이 가능한 게임.\n/// 각 메뉴가 어느 실습을 쓰는지 주석의 [실습 N] 으로 표시했다.\npublic class Game\n{\n    private readonly MonsterCodex _codex = new();   // [실습 8]\n    private readonly Guild _guild = new();          // [실습 3·9·10]\n    private Character _hero = null!;                 // [실습 7] — StartScreen 에서 생성\n\n    public void Run()\n    {\n        try { Console.OutputEncoding = System.Text.Encoding.UTF8; } catch { /* 일부 콘솔 미지원 */ }\n\n        _hero = StartScreen();   // [실습 1] 입출력\n        SeedGuild();             // 데모용 기존 길드원 2명\n\n        bool running = true;\n        while (running)          // [실습 5] 메인 메뉴 루프(종료를 고를 때까지 반복)\n        {\n            PrintMenu();\n            string? choice = Console.ReadLine();\n            if (choice is null) break;   // 입력 종료(EOF) → 안전 종료\n\n            switch (choice.Trim())\n            {\n                case &quot;1&quot;: Hunt(); break;\n                case &quot;2&quot;: ChangeJob(); break;\n                case &quot;3&quot;: JoinGuild(); break;\n                case &quot;4&quot;: _codex.Print(); break;\n                case &quot;5&quot;: ManageGuild(); break;\n                case &quot;6&quot;: Console.WriteLine(_hero.Describe()); break;\n                case &quot;0&quot;: running = false; break;\n                default: Console.WriteLine(&quot;알 수 없는 선택입니다.&quot;); break;\n            }\n        }\n\n        Console.WriteLine(&quot;\\n모험을 종료합니다. 또 오게, 모험가여.&quot;);\n    }\n\n    // ── [실습 1] 입출력 — 시작 화면 + 이름 입력 → 캐릭터 생성 ──\n    private Character StartScreen()\n    {\n        Console.WriteLine(&quot;╔══════════════════════════════╗&quot;);\n        Console.WriteLine(&quot;║        Q U E S T   L O G     ║&quot;);\n        Console.WriteLine(&quot;╚══════════════════════════════╝&quot;);\n        Console.WriteLine(&quot;어서 오게, 모험가여.&quot;);\n        Console.WriteLine(&quot;길드에 가입하려면 모험가 증명서를 발급해야 하네. 그 이름을 알려다오.&quot;);\n        Console.Write(&quot;[system] 모험가의 이름은? &quot;);\n\n        string? input = Console.ReadLine();\n        string name = string.IsNullOrWhiteSpace(input) ? &quot;이름없는떠돌이&quot; : input.Trim();\n\n        Console.WriteLine($&quot;── 환영하네, {name}! 슬라임부터 사냥해 실력을 증명해 보게. ──&quot;);\n        return new Character(name);   // [실습 7] 입력이 &#x27;캐릭터 데이터&#x27;가 된다\n    }\n\n    // 데모용으로 이미 길드에 있는 베테랑 2명을 심어 둔다.\n    private void SeedGuild()\n    {\n        _guild.Join(new Character(&quot;세라&quot;, Job.마법사, 11, 20, 90, 30));\n        _guild.Join(new Character(&quot;도윤&quot;, Job.도적,   13, 25, 110, 28));\n    }\n\n    private void PrintMenu()\n    {\n        Console.WriteLine(&quot;\\n========== 메뉴 ==========&quot;);\n        Console.WriteLine(&quot; 1) 사냥 (몬스터 선택·전투)&quot;);\n        Console.WriteLine(&quot; 2) 전직&quot;);\n        Console.WriteLine(&quot; 3) 길드 가입 신청&quot;);\n        Console.WriteLine(&quot; 4) 몬스터 도감&quot;);\n        Console.WriteLine(&quot; 5) 길드 관리 (명단·검색·추방)&quot;);\n        Console.WriteLine(&quot; 6) 내 정보&quot;);\n        Console.WriteLine(&quot; 0) 종료&quot;);\n        Console.Write(&quot;선택&gt; &quot;);\n    }\n\n    // ── 사냥: [실습 8] 도감에서 고르고 → [실습 5·6] 전투 ──\n    private void Hunt()\n    {\n        Console.WriteLine(&quot;\\n사냥할 몬스터를 고르세요:&quot;);\n        for (int i = 0; i &lt; _codex.Count; i++)\n        {\n            var m = _codex[i];\n            Console.WriteLine($&quot; {i + 1}) {m.Name} (HP {m.MaxHp}, ATK {m.Attack}, EXP {m.ExpReward})&quot;);\n        }\n        Console.Write(&quot;번호&gt; &quot;);\n\n        if (!int.TryParse(Console.ReadLine(), out int pick) || pick &lt; 1 || pick &gt; _codex.Count)\n        {\n            Console.WriteLine(&quot;잘못된 번호입니다.&quot;);\n            return;\n        }\n\n        var monster = _codex.Spawn(pick - 1);          // 전투용 사본\n        bool win = Battle.Fight(_hero, monster);       // [실습 5·6]\n\n        if (win)\n        {\n            _codex.MarkDefeated(monster.Name);\n            _hero.RecordKill(monster.ExpReward);       // 처치 수·레벨 성장\n            Console.WriteLine($&quot;경험치 {monster.ExpReward} 획득 → {_hero.Describe()}&quot;);\n        }\n        else\n        {\n            _hero.Heal();\n            Console.WriteLine(&quot;마을에서 회복했습니다. (HP 전체 회복)&quot;);\n        }\n    }\n\n    // ── [실습 4] 전직 ──\n    private void ChangeJob()\n    {\n        Console.WriteLine(&quot;\\n전직할 직업: 1) 기사  2) 도적  3) 마법사&quot;);\n        Console.Write(&quot;번호&gt; &quot;);\n\n        Job? wish = (Console.ReadLine()?.Trim()) switch\n        {\n            &quot;1&quot; =&gt; Job.기사,\n            &quot;2&quot; =&gt; Job.도적,\n            &quot;3&quot; =&gt; Job.마법사,\n            _ =&gt; null\n        };\n        if (wish is null) { Console.WriteLine(&quot;잘못된 선택입니다.&quot;); return; }\n\n        bool ok = _hero.TryChangeJob(wish.Value, out string msg);\n        Console.WriteLine((ok ? &quot;[성공] &quot; : &quot;[실패] &quot;) + msg);\n    }\n\n    // ── [실습 3] 길드 가입 조건 판정 ──\n    private void JoinGuild()\n    {\n        if (_guild.Find(_hero.Name) is not null)\n        {\n            Console.WriteLine(&quot;이미 길드원입니다.&quot;);\n            return;\n        }\n        if (_guild.CanJoin(_hero, out string reason))\n        {\n            _guild.Join(_hero);\n            Console.WriteLine($&quot;[가입] 환영합니다, {_hero.Name}! ({reason})&quot;);\n        }\n        else\n        {\n            Console.WriteLine($&quot;[거절] {reason}&quot;);\n        }\n    }\n\n    // ── [실습 9·10] 길드 관리: 명단·검색·추방 ──\n    private void ManageGuild()\n    {\n        _guild.PrintRoster();\n        Console.WriteLine(&quot;\\n a) 이름 검색   b) 추방   (그 외: 뒤로)&quot;);\n        Console.Write(&quot;선택&gt; &quot;);\n\n        switch (Console.ReadLine()?.Trim())\n        {\n            case &quot;a&quot;:\n                Console.Write(&quot;검색할 이름&gt; &quot;);\n                string q = Console.ReadLine()?.Trim() ?? &quot;&quot;;\n                var found = _guild.Find(q);                        // [실습 10]\n                Console.WriteLine(found is null ? $&quot;&#x27;{q}&#x27; 없음&quot; : &quot;찾음: &quot; + found.Describe());\n                break;\n\n            case &quot;b&quot;:\n                Console.Write(&quot;추방할 이름&gt; &quot;);\n                string k = Console.ReadLine()?.Trim() ?? &quot;&quot;;\n                Console.WriteLine(_guild.Expel(k)                  // [실습 9]\n                    ? $&quot;&#x27;{k}&#x27; 님을 추방했습니다.&quot;\n                    : $&quot;&#x27;{k}&#x27; 님은 명단에 없습니다.&quot;);\n                break;\n        }\n    }\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cdetails class=\"source-file\">\u003csummary>Models/Character.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>namespace TextRpg;\n\n/// 플레이어/길드원 캐릭터.\n/// [실습 7] 값(필드)과 동작(메서드)을 하나로 묶은 핵심 클래스로,\n/// [실습 2] 체력 교환 · [실습 4] 전직 · [실습 6] 치명타 피해를 메서드로 품는다.\npublic class Character\n{\n    private static readonly Random Rng = new();\n\n    public string Name { get; }\n    public Job Job { get; private set; } = Job.모험가;\n    public int Level { get; private set; } = 1;\n    public int MaxHp { get; private set; }\n    public int Hp { get; private set; }\n    public int Attack { get; private set; }\n    public int Kills { get; private set; }         // 몬스터 처치 수(가입·전직 조건의 재료)\n\n    public bool IsAlive =&gt; Hp &gt; 0;\n\n    /// 신규 모험가 생성.\n    public Character(string name, int maxHp = 100, int attack = 15)\n    {\n        Name = name;\n        MaxHp = maxHp;\n        Hp = maxHp;\n        Attack = attack;\n    }\n\n    /// 기존 길드원(베테랑)을 불러올 때 쓰는 생성자 — 데모 시드용.\n    public Character(string name, Job job, int level, int kills, int maxHp, int attack)\n    {\n        Name = name;\n        Job = job;\n        Level = level;\n        Kills = kills;\n        MaxHp = maxHp;\n        Hp = maxHp;\n        Attack = attack;\n    }\n\n    // [실습 2] 두 캐릭터의 체력을 맞바꾼다(튜플 교환).\n    public void SwapHpWith(Character other) =&gt; (Hp, other.Hp) = (other.Hp, Hp);\n\n    // [실습 6] 치명타 판정 + 피해 계산을 한 메서드로.\n    public (int damage, bool isCritical) RollDamage(double critChance = 0.3, double critMultiplier = 1.5)\n    {\n        bool crit = Rng.NextDouble() &lt; critChance;\n        int dmg = crit ? (int)(Attack * critMultiplier) : Attack;\n        return (dmg, crit);\n    }\n\n    public void TakeDamage(int amount) =&gt; Hp = Math.Max(0, Hp - amount);\n\n    public void Heal() =&gt; Hp = MaxHp;\n\n    /// 몬스터 처치 기록 + 간단한 성장(레벨/스탯).\n    public void RecordKill(int expReward)\n    {\n        Kills++;\n        if (expReward &gt;= 30 || Kills % 2 == 0)   // 보상이 크거나 2킬마다 레벨업\n        {\n            Level++;\n            MaxHp += 10;\n            Attack += 3;\n            Hp = MaxHp;                           // 레벨업 시 완전 회복\n        }\n    }\n\n    // [실습 4] 조건(레벨·처치 수)을 만족하면 전직한다.\n    public bool TryChangeJob(Job wish, out string message)\n    {\n        const int JobLevel = 3;\n\n        if (Job != Job.모험가)\n        {\n            message = $&quot;이미 {Job}(으)로 전직했습니다.&quot;;\n            return false;\n        }\n        if (Level &lt; JobLevel)\n        {\n            message = $&quot;전직은 Lv.{JobLevel}부터 가능합니다. (현재 Lv.{Level})&quot;;\n            return false;\n        }\n\n        bool ok = wish switch                     // [실습 4] switch 식 분기\n        {\n            Job.기사   =&gt; Kills &gt;= 4,             // 기사: 처치 4↑\n            Job.도적   =&gt; Kills &gt;= 3,             // 도적: 처치 3↑\n            Job.마법사 =&gt; Level &gt;= 4,             // 마법사: 레벨 4↑\n            _ =&gt; false\n        };\n        if (!ok)\n        {\n            message = $&quot;{wish} 전직 조건을 아직 못 채웠습니다. (Lv.{Level}, 처치 {Kills})&quot;;\n            return false;\n        }\n\n        Job = wish;\n        MaxHp += 20;                              // 전직 보너스\n        Attack += 5;\n        Hp = MaxHp;\n        message = $&quot;모험가 → {wish} 전직 완료! (보너스: 최대체력+20, 공격력+5)&quot;;\n        return true;\n    }\n\n    public string Describe() =&gt;\n        $&quot;[{Name}] {Job} Lv.{Level}  HP {Hp}/{MaxHp}  ATK {Attack}  처치 {Kills}&quot;;\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cdetails class=\"source-file\">\u003csummary>Models/Job.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>namespace TextRpg;\n\n/// 직업. 신규는 모험가로 시작하고, 조건을 만족하면 전직한다. (실습 4)\npublic enum Job\n{\n    모험가,\n    기사,\n    도적,\n    마법사\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cdetails class=\"source-file\">\u003csummary>Models/Monster.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>namespace TextRpg;\n\n/// 도감에 등록되는 몬스터. (실습 8)\n/// 전투로 체력이 깎이므로, 사냥할 때는 Clone() 으로 사본을 만들어 싸운다.\npublic class Monster\n{\n    public string Name { get; }\n    public int MaxHp { get; }\n    public int Hp { get; private set; }\n    public int Attack { get; }\n    public int ExpReward { get; }\n    public string Habitat { get; }\n\n    public bool IsAlive =&gt; Hp &gt; 0;\n\n    public Monster(string name, int hp, int attack, int expReward, string habitat)\n    {\n        Name = name;\n        MaxHp = hp;\n        Hp = hp;\n        Attack = attack;\n        ExpReward = expReward;\n        Habitat = habitat;\n    }\n\n    public void TakeDamage(int amount) =&gt; Hp = Math.Max(0, Hp - amount);\n\n    /// 원본 도감을 건드리지 않도록 전투용 사본을 만든다.\n    public Monster Clone() =&gt; new(Name, MaxHp, Attack, ExpReward, Habitat);\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cdetails class=\"source-file\">\u003csummary>Program.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>// 최종 게임 진입점 — 10개 실습 기능을 통합해 실제로 플레이한다.\n// 실행: dotnet run --project src/projects/text-rpg\nusing TextRpg;\n\nnew Game().Run();\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cdetails class=\"source-file\">\u003csummary>Systems/Battle.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>namespace TextRpg;\n\n/// [실습 5·6] 전투 — 한쪽이 쓰러질 때까지 &#x27;반복&#x27;하며, 매 턴 &#x27;치명타 함수&#x27;로 피해를 낸다.\npublic static class Battle\n{\n    /// 영웅이 몬스터와 싸운다. 영웅이 살아남으면 true(승리).\n    public static bool Fight(Character hero, Monster monster)\n    {\n        Console.WriteLine($&quot;\\n⚔ {hero.Name} VS {monster.Name} (HP {monster.Hp}, ATK {monster.Attack})&quot;);\n        int turn = 0;\n\n        // [실습 5] 끝 조건(둘 중 하나 사망)까지 반복\n        while (hero.IsAlive &amp;&amp; monster.IsAlive)\n        {\n            turn++;\n\n            // 영웅 공격 — [실습 6] 치명타 함수\n            var (dmg, crit) = hero.RollDamage();\n            monster.TakeDamage(dmg);\n            Console.WriteLine($&quot; {turn,2}턴 | {hero.Name} {(crit ? &quot;⚡치명타&quot; : &quot;공격  &quot;)} {dmg,3} → {monster.Name} HP {monster.Hp}&quot;);\n            if (!monster.IsAlive) break;\n\n            // 몬스터 반격\n            hero.TakeDamage(monster.Attack);\n            Console.WriteLine($&quot;     | {monster.Name} 반격 {monster.Attack,3} → {hero.Name} HP {hero.Hp}&quot;);\n        }\n\n        bool win = hero.IsAlive;\n        Console.WriteLine(win\n            ? $&quot;🏆 {monster.Name} 처치! ({turn}턴)&quot;\n            : $&quot;💀 {hero.Name} 쓰러졌습니다...&quot;);\n        return win;\n    }\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cdetails class=\"source-file\">\u003csummary>Systems/Guild.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>namespace TextRpg;\n\n/// 모험가 길드.\n/// [실습 3] 가입 조건 판정 · [실습 9] 명단(List)·추방 · [실습 10] 이름 검색(Dictionary).\n/// 명단은 순서가 있는 List, 검색은 빠른 Dictionary — 목적에 맞게 둘을 함께 유지한다.\npublic class Guild\n{\n    public const int RequiredLevel = 2;\n    public const int RequiredKills = 1;\n\n    private readonly List&lt;Character&gt; _members = new();                 // [실습 9] 순서 있는 명단\n    private readonly Dictionary&lt;string, Character&gt; _byName = new();    // [실습 10] 이름 → 캐릭터\n\n    public int Count =&gt; _members.Count;\n\n    // [실습 3] 가입 조건: 레벨·처치 수를 비교·논리 연산으로 가공해 bool 판정.\n    public bool CanJoin(Character c, out string reason)\n    {\n        bool levelOk = c.Level &gt;= RequiredLevel;\n        bool killsOk = c.Kills &gt;= RequiredKills;\n        if (levelOk &amp;&amp; killsOk)\n        {\n            reason = &quot;조건 충족&quot;;\n            return true;\n        }\n        int needLv = Math.Max(0, RequiredLevel - c.Level);\n        int needKill = Math.Max(0, RequiredKills - c.Kills);\n        reason = $&quot;레벨 {needLv} · 처치 {needKill}마리 더 필요&quot;;\n        return false;\n    }\n\n    public bool Join(Character c)\n    {\n        if (_byName.ContainsKey(c.Name)) return false;   // 이름 중복 방지(키는 고유)\n        _members.Add(c);\n        _byName[c.Name] = c;                             // List·Dictionary 동시 갱신\n        return true;\n    }\n\n    // [실습 9] 추방 — List 에서 제거하고 Dictionary 도 함께 지운다.\n    public bool Expel(string name)\n    {\n        if (!_byName.TryGetValue(name, out var c)) return false;\n        _members.Remove(c);\n        _byName.Remove(name);\n        return true;\n    }\n\n    // [실습 10] 이름으로 빠르게 검색(없으면 null).\n    public Character? Find(string name)\n    {\n        _byName.TryGetValue(name, out var c);\n        return c;\n    }\n\n    public void PrintRoster()\n    {\n        Console.WriteLine($&quot;── 길드원 {Count}명 ──&quot;);\n        if (Count == 0) { Console.WriteLine(&quot;  (비어 있음)&quot;); return; }\n        foreach (var m in _members)\n            Console.WriteLine(&quot;  &quot; + m.Describe());\n    }\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cdetails class=\"source-file\">\u003csummary>Systems/MonsterCodex.cs\u003c/summary>\u003cdiv class=\"code\">\u003cdiv class=\"codebar\">\u003cspan>C# · 원본 코드\u003c/span>\u003cbutton class=\"copy\">복사\u003c/button>\u003c/div>\u003cpre>\u003ccode>namespace TextRpg;\n\n/// [실습 8] 몬스터 도감 — 몬스터 종류를 &#x27;배열&#x27;로 보관하고 처치 여부를 추적한다.\npublic class MonsterCodex\n{\n    private readonly Monster[] _monsters =\n    {\n        new(&quot;슬라임&quot;, 30,  6,  20,  &quot;초원&quot;),\n        new(&quot;고블린&quot;, 55,  12, 30,  &quot;동굴&quot;),\n        new(&quot;오크&quot;,   110, 20, 50,  &quot;폐광&quot;),\n        new(&quot;드래곤&quot;, 300, 45, 120, &quot;화산&quot;),\n    };\n\n    private readonly HashSet&lt;string&gt; _defeated = new();   // 처치한 종 이름\n\n    public int Count =&gt; _monsters.Length;\n\n    public Monster this[int index] =&gt; _monsters[index];\n\n    /// 전투용 사본 하나를 뽑는다(원본 도감은 체력이 깎이지 않게).\n    public Monster Spawn(int index) =&gt; _monsters[index].Clone();\n\n    public void MarkDefeated(string name) =&gt; _defeated.Add(name);\n\n    public void Print()\n    {\n        Console.WriteLine(&quot;── 몬스터 도감 ──&quot;);\n        for (int i = 0; i &lt; _monsters.Length; i++)       // 인덱스 순회\n        {\n            var m = _monsters[i];\n            string mark = _defeated.Contains(m.Name) ? &quot;✔처치&quot; : &quot;미처치&quot;;\n            Console.WriteLine(\n                $&quot;No.{i + 1,-2} {m.Name,-4} HP {m.MaxHp,3} ATK {m.Attack,2} EXP {m.ExpReward,3} [{mark}] @{m.Habitat}&quot;);\n        }\n    }\n}\n\u003c/code>\u003c/pre>\u003c/div>\u003c/details>\u003cp>원본의 파일 범위 네임스페이스, 최상위 문, 대상 형식 new, 튜플, nullable 표현은 기존 기타 문법 문서와 연결해서 읽을 수 있습니다. 예제를 명시적인 Main으로 바꾸는 것은 가능하지만 선언 순서와 이름 공간을 중복시키지 않습니다.\u003c/p>", "search": "09. 실제 코드와 대조하기\n\n### 구현을 마친 후 확인\n\n아래 파일별 원본은 문서 생성 시점의 프로젝트 코드입니다. 먼저 두 문서의 계약으로 구현하고, 막힌 부분이나 책임 배분을 확인할 때 펼쳐봅니다. 전부 복사하여 실행되는 것과 **기획의 어느 문장이 어느 메서드로 바뀌었는지 설명하는 것**을 구분하세요.\n\n\u003c!-- SOURCES -->\n\n원본의 파일 범위 네임스페이스, 최상위 문, 대상 형식 new, 튜플, nullable 표현은 기존 기타 문법 문서와 연결해서 읽을 수 있습니다. 예제를 명시적인 Main으로 바꾸는 것은 가능하지만 선언 순서와 이름 공간을 중복시키지 않습니다.\n"}];

function save(key,value){try{localStorage.setItem(key,value);return true}catch{$('status').textContent='브라우저 저장을 사용할 수 없습니다. 현재 화면에서는 학습을 계속할 수 있습니다.';return false}}
function themeLabel(){const dark=document.body.classList.contains('dark');$('theme').textContent=dark?'밝은 화면':'어두운 화면';$('theme').setAttribute('aria-pressed',String(dark))}
function toc(){const q=$('search').value.trim().toLocaleLowerCase();$('toc').replaceChildren();let count=0;chapters.forEach((c,i)=>{if(q&&!c.search.toLocaleLowerCase().includes(q))return;count++;const a=document.createElement('a');a.href='#lesson-'+(i+1);a.textContent=(completed.includes(i)?'✓ ':'')+c.title;if(i===current)a.setAttribute('aria-current','page');$('toc').append(a)});$('empty').hidden=count>0;$('progress').max=chapters.length;$('progress').value=completed.length;$('progressText').textContent=`학습 완료 ${completed.length} / ${chapters.length}`}
function show(){const match=location.hash.match(/^#lesson-(\d+)$/);const n=match?Number(match[1])-1:0;current=n>=0&&n<chapters.length?n:0;const c=chapters[current];$('title').textContent=c.title;document.title=c.title+' · TextRPG 시스템문서';$('counter').textContent=`LESSON ${String(current+1).padStart(2,'0')} / ${chapters.length}`;$('content').innerHTML=c.body;$('prev').disabled=current===0;$('next').disabled=current===chapters.length-1;$('complete').textContent=completed.includes(current)?'✓ 완료됨 · 표시 취소':'학습 완료 표시';$('complete').setAttribute('aria-pressed',String(completed.includes(current)));$('status').textContent='';toc()}
function go(delta){location.hash='lesson-'+(current+1+delta)}
window.addEventListener('hashchange',()=>{show();window.scrollTo(0,0)});$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('search').oninput=toc;
$('complete').onclick=()=>{completed=completed.includes(current)?completed.filter(x=>x!==current):[...completed,current];show();save('textrpg-시스템문서-completed',JSON.stringify(completed))};
$('theme').onclick=()=>{document.body.classList.toggle('dark');themeLabel();save('csharp-first-theme',document.body.classList.contains('dark')?'dark':'light')};
$('content').addEventListener('click',async event=>{const button=event.target.closest('.copy');if(!button)return;const code=button.closest('.code').querySelector('code').textContent;try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(code);$('status').textContent='코드를 복사했습니다. Program.cs에 붙여 넣으세요.'}catch{const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(button.closest('.code').querySelector('code'));selection.removeAllRanges();selection.addRange(range);$('status').textContent='코드를 선택했습니다. Ctrl+C로 복사하세요.'}});
themeLabel();show();
</script></body></html>
