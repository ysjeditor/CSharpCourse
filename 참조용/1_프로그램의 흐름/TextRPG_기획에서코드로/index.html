<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TextRPG · 기획에서 코드로</title><style>
:root{color-scheme:light;--bg:#f5f7fa;--paper:#fff;--ink:#202c3d;--muted:#58697e;--line:#dce3eb;--accent:#185f90;--soft:#e9f2f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 'Segoe UI','Malgun Gothic',sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);padding:6px 12px}button:hover{background:var(--soft)}:focus-visible{outline:3px solid #d78224;outline-offset:3px}aside{position:fixed;inset:0 auto 0 0;width:300px;background:var(--paper);border-right:1px solid var(--line);padding:28px 20px;overflow:auto}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.label{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700}.sub{font-size:13px;color:var(--muted)}input{width:100%;padding:10px 12px;margin:22px 0 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}nav a{display:block;text-decoration:none;color:var(--muted);font-size:14px;padding:9px 10px;border-radius:7px;margin:3px 0}nav a[aria-current=page]{color:var(--accent);background:var(--soft);font-weight:700}nav a:hover{background:var(--bg)}progress{width:100%;height:7px;accent-color:var(--accent)}main{margin-left:300px;padding:30px 6vw 60px;max-width:1300px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px}.toolbar span{font-size:13px;color:var(--muted)}.hero{padding:38px 0 24px}h1{font-size:clamp(27px,3vw,39px);letter-spacing:-1.2px;line-height:1.4;margin:12px 0}article{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 38px 35px}h2{font-size:20px;margin:30px 0 12px;letter-spacing:-.4px}p{margin:12px 0;word-break:keep-all;overflow-wrap:anywhere}.code{margin:20px 0;border-radius:9px;overflow:hidden;background:#142235;color:#e3edf7}.codebar{display:flex;justify-content:space-between;align-items:center;padding:8px 15px;background:#20334b;font-size:12px}.copy{font-size:12px;background:#2d4664;color:white;border-color:#50657e}pre{margin:0;padding:22px;overflow:auto;line-height:1.7;font:14px/1.75 Consolas,monospace;tab-size:4}details{background:var(--soft);padding:16px 20px;border-radius:8px;margin-top:25px}summary{cursor:pointer;color:var(--accent);font-weight:700}.bottom{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}.bottom button:disabled{opacity:.4;cursor:default}.done{background:var(--accent);color:white}.done:hover{background:#124b73}footer{color:var(--muted);font-size:12px;margin-top:35px}footer a{color:var(--accent)}.notice{border-left:3px solid var(--accent);padding:8px 15px;color:var(--muted);font-size:14px;margin-bottom:25px}#status{font-size:13px;color:var(--accent);min-height:24px}body.dark{color-scheme:dark;--bg:#121c29;--paper:#1a2838;--ink:#e2ebf4;--muted:#acbdd0;--line:#35485d;--accent:#80c6f2;--soft:#243c51}body.dark .done{background:#285f85;color:white}.skip{position:absolute;left:-9999px}.skip:focus{left:320px;top:10px;background:var(--paper);z-index:5}
@media(max-width:850px){aside{position:relative;width:auto;border-right:0;border-bottom:1px solid var(--line);padding:20px}nav{max-height:210px;overflow:auto}main{margin:0;padding:20px}article{padding:8px 20px 25px}.hero{padding-top:25px}.toolbar{flex-wrap:wrap}.skip:focus{left:10px}}@media print{aside,.toolbar,.bottom,.copy,#status,.notice{display:none}main{margin:0;padding:0;max-width:none}article{border:0;padding:0}body{background:white;color:black}pre{white-space:pre-wrap;color:black}.code,.codebar{background:#f0f0f0;color:black}details{display:block}details>*{display:block}footer{margin-top:20px}}
article h2{padding-bottom:9px;border-bottom:1px solid var(--line);margin-top:38px}article h3{font-size:18px;line-height:1.6;letter-spacing:-.3px;margin:29px 0 12px;color:var(--accent)}article h4,article h5{font-size:16px;margin:22px 0 10px}article strong{font-weight:750}article :not(pre)>code{font: .91em/1.7 Consolas,'Malgun Gothic',monospace;background:var(--soft);color:var(--accent);padding:2px 5px;border-radius:4px;font-variant-ligatures:none}article ul,article ol{padding-left:1.65em;margin:15px 0}article li{padding-left:4px;margin:8px 0;overflow-wrap:anywhere}article blockquote{margin:22px 0;padding:8px 20px;background:var(--soft);border-left:4px solid var(--accent);border-radius:0 7px 7px 0}article blockquote p{margin:9px 0}.table-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--line);border-radius:8px}article table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.75;min-width:460px}article th,article td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}article th{background:var(--soft);font-weight:700}article tbody tr:last-child td{border-bottom:0}article pre{font-variant-ligatures:none}article .codebar span{font-size:12px}article p{line-height:1.95}@media(max-width:600px){article h3{font-size:17px}article blockquote{padding:6px 14px}article th,article td{padding:9px 11px}}
.diagram{margin:24px 0;border:1px solid var(--line);border-radius:12px;overflow:auto;background:#f6f8fc}.diagram svg{display:block;width:100%;min-width:720px;height:auto;font-family:'Segoe UI','Malgun Gothic',sans-serif}.source-file{background:var(--bg);padding:14px 18px;margin:15px 0}.source-file summary{overflow-wrap:anywhere}.source-file .code{margin-bottom:5px}.doc-type{padding:5px 10px;border-radius:4px;background:var(--soft);color:var(--accent);font-size:12px}.guide-shell{max-width:1520px;margin:auto;padding:25px}.guide-head{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.guide-head h1{font-size:30px}.guide-links a{color:var(--accent);font-size:14px}.guide-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;margin-top:22px}.tasknav{padding:15px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.tasknav button{display:block;width:100%;margin:7px 0;text-align:left;font-size:14px;line-height:1.6}.tasknav button[aria-current=step]{background:var(--soft);color:var(--accent);font-weight:700}.task-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}.task-card h2{margin:0 0 12px}.task-card label{display:flex;align-items:center;gap:10px;font-size:14px}.task-card input{width:auto;margin:0}.document-pair{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}.frame-card{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}.frame-title{padding:10px 15px;font-size:13px;font-weight:700;background:var(--soft);display:flex;justify-content:space-between}.frame-title a{color:var(--accent)}iframe{width:100%;height:760px;border:0;background:white}.practice-note{font-size:13px;color:var(--muted)}.task-progress{font-size:13px;color:var(--muted);padding:12px 0}.guide-shell button:disabled{opacity:.5}.task-next{display:flex;gap:10px;margin-top:15px}.source-file code{font-variant-ligatures:none}@media(max-width:1250px){.guide-layout{grid-template-columns:1fr}.tasknav{display:flex;flex-wrap:wrap;gap:8px}.tasknav button{width:auto;margin:0}.document-pair{grid-template-columns:1fr}iframe{height:650px}}@media(max-width:650px){.guide-shell{padding:16px}.task-card{padding:18px}.guide-head h1{font-size:25px}.diagram svg{min-width:680px}}
</style></head><body><div class="guide-shell"><header class="guide-head"><div><div class="label">DESIGN → SYSTEM → CODE</div><h1>TextRPG · 기획에서 코드로</h1><div class="sub">기획의 문장을 클래스의 값·조건·동작으로 바꾸는 실습</div></div><div class="guide-links"><a href="기획문서.html" target="_blank" rel="noopener">기획 문서만 보기</a> · <a href="시스템문서.html" target="_blank" rel="noopener">시스템 문서만 보기</a></div></header><div class="guide-layout"><nav class="tasknav" id="tasks" aria-label="실습 단계"></nav><section class="task-card"><h2 id="taskTitle"></h2><p id="taskGoal"></p><p class="sub" id="taskFiles"></p><p id="taskCheck"></p><details><summary>구현 전에 생각할 힌트</summary><p id="taskHint"></p></details><div class="task-progress" id="progress"></div><label><input id="finished" type="checkbox">직접 구현하고 결과를 확인했습니다</label><div class="task-next"><button id="before">← 이전 과제</button><button id="after">다음 과제 →</button></div><div id="storageStatus" role="status"></div></section></div><p class="practice-note">과제를 고르면 두 문서의 해당 단원으로 이동합니다. 실제 구현은 별도의 Visual Studio 콘솔 프로젝트에서 진행하세요. 작은 창에서는 문서를 새 탭으로 열면 읽기 편합니다.</p><div class="document-pair"><section class="frame-card"><div class="frame-title">기획 · 무엇을 만들어야 하는가<a id="planLink" href="기획문서.html" target="_blank" rel="noopener">새 탭</a></div><iframe id="plan" title="게임 기획 문서"></iframe></section><section class="frame-card"><div class="frame-title">시스템 · 누가 어떤 책임을 맡는가<a id="systemLink" href="시스템문서.html" target="_blank" rel="noopener">새 탭</a></div><iframe id="system" title="클래스와 시스템 문서"></iframe></section></div></div><script>const tasks=[{"id": "01", "title": "프로젝트와 진입점", "plan": 2, "system": 1, "goal": ".NET 10 콘솔 프로젝트를 만들고 8개 파일의 경로를 준비하세요. Program은 Game.Run을 호출하고 메뉴 0으로 종료하도록 작은 흐름부터 연결합니다.", "files": "TextRpg.csproj · Program.cs · Game.cs", "check": "하나의 진입점만 남겼는가? 메뉴를 반복하며 0으로 종료되는가?", "hint": "Models/Systems 폴더와 namespace TextRpg는 다른 분류입니다. 처음에는 Game.Run에 시작·종료 출력만 만들어도 됩니다."}, {"id": "02", "title": "캐릭터와 몬스터", "plan": 2, "system": 2, "goal": "Job enum, Character와 Monster의 생성자·프로퍼티·생존 판단·피해 처리부터 구현합니다. 외부에서 HP를 직접 바꾸지 않도록 구성하세요.", "files": "Models/Job.cs · Character.cs · Monster.cs", "check": "신규 HP 100, ATK 15인가? HP 10에서 피해 20을 받으면 0인가?", "hint": "값을 먼저 나열하고, 누가 바꿀 수 있는지 정한 다음 동작 메서드를 작성하세요."}, {"id": "03", "title": "치명타와 지역 변수", "plan": 3, "system": 4, "goal": "Character.RollDamage가 피해와 치명 여부를 튜플로 반환하도록 작성하세요. 반환값을 호출한 곳에서 분해합니다.", "files": "Models/Character.cs", "check": "ATK 15에서 확률 0은 15, 확률 1은 22를 반환하는가?", "hint": "정수 변환 시 소수 부분이 잘립니다. 확률 판정과 계산을 서로 다른 변수로 나누면 확인하기 쉽습니다."}, {"id": "04", "title": "도감 원본과 전투 사본", "plan": 5, "system": 3, "goal": "네 종의 Monster 배열과 처치 HashSet을 만들고 Spawn이 Clone을 돌려주도록 구현하세요.", "files": "Systems/MonsterCodex.cs · Models/Monster.cs", "check": "슬라임 사본을 공격해도 원본 HP는 30인가? 같은 종을 두 번 표시해도 기록은 하나인가?", "hint": "배열 요소를 그대로 반환하는 인덱서와 새 객체를 생성하는 Spawn의 차이를 구분하세요."}, {"id": "05", "title": "반복 전투와 반환", "plan": 3, "system": 4, "goal": "Battle.Fight를 작성하고 Game.Hunt에서 결과를 받으세요. 영웅 선공, 처치 후 반격 없음, 패배 후 회복을 구현합니다.", "files": "Systems/Battle.cs · Game.Hunt", "check": "살아남은 몬스터만 반격하는가? 실패 후 보상을 주지 않는가?", "hint": "전투가 bool을 반환한 뒤 승패 후 처리를 Game이 담당합니다. 보상을 두 곳에서 처리하지 마세요."}, {"id": "06", "title": "성장과 전직", "plan": 4, "system": 5, "goal": "RecordKill과 TryChangeJob을 구현하세요. 기획의 AND/OR와 검사 순서를 코드로 바꿉니다.", "files": "Models/Character.cs · Game.ChangeJob", "check": "슬라임 4킬 후 Lv.3/ATK21, 기사 전직 후 HP140/ATK26인가? 재전직은 거절되는가?", "hint": "보상 30 이상 OR 짝수 처치이면 레벨을 한 번 올립니다. 누적 경험치 필드는 만들지 않습니다."}, {"id": "07", "title": "가입 조건과 등록 분리", "plan": 6, "system": 6, "goal": "CanJoin은 판정, Join은 중복 없는 등록을 담당하도록 나누세요. Game에서 중복·조건·등록 순서를 연결합니다.", "files": "Systems/Guild.cs · Game.JoinGuild", "check": "레벨 1·처치 0은 거절, 레벨 2·처치 1은 허용되는가? 같은 이름은 두 번 등록되지 않는가?", "hint": "Join이 조건 검사를 대신한다고 생각하지 마세요. 시드 등록과 플레이어 가입 메뉴의 호출 흐름이 다릅니다."}, {"id": "08", "title": "명단·검색·추방의 일관성", "plan": 6, "system": 6, "goal": "List와 Dictionary에 같은 Character를 등록하고, 추방 시 두 자료구조를 함께 갱신하세요.", "files": "Systems/Guild.cs · Game.ManageGuild", "check": "추방 후 명단 수가 줄고 검색도 null인가? 등록한 플레이어의 성장 상태가 검색에도 반영되는가?", "hint": "Character를 새로 복사해서 두 곳에 따로 넣는 대신 같은 참조를 연결합니다."}, {"id": "09", "title": "전체 메뉴와 잘못된 입력", "plan": 8, "system": 7, "goal": "StartScreen, SeedGuild, 각 메뉴를 Run의 반복에 조립하세요. 이름·메뉴·사냥 번호의 잘못된 입력을 처리합니다.", "files": "Game.cs · Program.cs", "check": "빈 이름, abc 몬스터 번호, 0/5 범위 밖 번호, 없는 이름, 메인 EOF가 안전하게 처리되는가?", "hint": "숫자 범위 검사를 한 뒤 pick - 1을 계산하세요. 데모의 가입·전직 수치를 혼용하지 않습니다."}, {"id": "10", "title": "기획과 코드 대조·확장 판단", "plan": 7, "system": 9, "goal": "각 요구사항이 어느 클래스의 어느 메서드에 구현됐는지 설명하세요. HP 교환은 기본 메뉴에 없음을 확인하고 확장 명세를 먼저 작성하세요.", "files": "기획·시스템 문서 · Character.SwapHpWith", "check": "현재 계약의 대상은 Character인가 Monster인가? 상한이 다른 HP 교환 정책을 정했는가?", "hint": "Character.SwapHpWith(Character)는 Monster를 받지 않습니다. 메서드 이름만 보고 전투 스킬이 완성됐다고 가정하지 않습니다."}];
const get=id=>document.getElementById(id);
let selected=0,done=[];
try{const raw=JSON.parse(localStorage.getItem('textrpg-design-tasks')||'[]');if(Array.isArray(raw))done=[...new Set(raw.filter(n=>Number.isInteger(n)&&n>=0&&n<tasks.length))];}catch{}
function showTask(index){selected=index;const task=tasks[index];get('taskTitle').textContent=`${task.id}. ${task.title}`;get('taskGoal').textContent=task.goal;get('taskFiles').textContent='작성할 파일: '+task.files;get('taskCheck').textContent='확인할 결과: '+task.check;get('taskHint').textContent=task.hint;get('plan').src='기획문서.html#lesson-'+task.plan;get('system').src='시스템문서.html#lesson-'+task.system;get('planLink').href='기획문서.html#lesson-'+task.plan;get('systemLink').href='시스템문서.html#lesson-'+task.system;get('finished').checked=done.includes(index);get('before').disabled=index===0;get('after').disabled=index===tasks.length-1;get('progress').textContent=`직접 확인 완료 ${done.length} / ${tasks.length} · 체크 표시는 자동 채점 결과가 아닙니다.`;get('tasks').querySelectorAll('button').forEach((b,i)=>{b.textContent=(done.includes(i)?'✓ ':'')+tasks[i].id+' '+tasks[i].title;if(i===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});}
tasks.forEach((task,index)=>{const button=document.createElement('button');button.onclick=()=>showTask(index);get('tasks').append(button);});
get('finished').onchange=()=>{done=get('finished').checked?[...new Set([...done,selected])]:done.filter(n=>n!==selected);try{localStorage.setItem('textrpg-design-tasks',JSON.stringify(done));get('storageStatus').textContent='';}catch{get('storageStatus').textContent='브라우저 저장이 제한되어 현재 화면에서만 기록합니다.';}showTask(selected);};
get('before').onclick=()=>{if(selected>0)showTask(selected-1);};get('after').onclick=()=>{if(selected<tasks.length-1)showTask(selected+1);};showTask(0);
</script></body></html>
